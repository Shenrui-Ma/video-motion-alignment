<text x="70" y="942.8" text-anchor="start" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" font-weight="400" fill="#58677b">Exploratory single-case evidence: no precise onset, continuous trend, or complete control-observation gap is established.</text>
