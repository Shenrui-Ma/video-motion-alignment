<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>H3 · 10月20日新增实验</title><style>
:root{color-scheme:dark;--bg:#101317;--panel:#191e25;--edge:#323943;--text:#ecedf0;--muted:#aeb8c5;--accent:#8db9ee}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,select,input{font:inherit}button,select{background:#222a34;color:var(--text);border:1px solid #45505d;border-radius:7px;padding:7px 11px;cursor:pointer}button:hover,button.active{border-color:var(--accent);color:#c2dcff}header{padding:28px 32px 18px;border-bottom:1px solid var(--edge)}h1{font-size:27px;margin:0 0 5px}p{margin:6px 0}.muted{color:var(--muted)}.stats{display:flex;gap:24px;margin:14px 0 8px;flex-wrap:wrap}.stats b{font-size:24px;padding-right:7px}.filters{display:flex;gap:8px;margin-top:14px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);max-width:1720px;margin:auto}aside{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--edge);padding:17px 12px}.nav{display:block;width:100%;text-align:left;margin:0 0 8px;background:transparent;border-color:transparent;font-size:14px}.nav small{display:block;color:var(--muted);font-size:12px}.nav.active{background:#203044}main{padding:24px 28px 60px;min-width:0}h2{font-size:23px;margin:0 0 7px}.badges{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{font-size:12px;border:1px solid var(--edge);padding:2px 8px;border-radius:4px;color:var(--muted)}.status{display:flex;justify-content:space-between;gap:20px;margin:15px 0 13px;font-weight:600;flex-wrap:wrap}.media{width:100%;display:block;background:#000;border:1px solid var(--edge);border-radius:4px}video{max-height:66vh}.caption{font-size:13px;color:var(--muted);margin:5px 0 17px}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:10px 0}.metrics{display:flex;gap:28px;padding:14px 0;border-bottom:1px solid var(--edge);flex-wrap:wrap}.metric b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.metric span{color:var(--muted);font-size:13px}.review{padding:15px 0;font-size:16px}.version{display:flex;align-items:center;gap:12px;margin:12px 0 18px;flex-wrap:wrap}select{max-width:100%}details{border-top:1px solid var(--edge);padding:13px 0}summary{cursor:pointer;color:#bfd5ef}pre{white-space:pre-wrap;word-break:break-word;background:#0b0e12;padding:14px;border-radius:6px;font-size:13px;line-height:1.7}.note{background:#1c2530;border-left:3px solid var(--accent);padding:12px 16px;margin:16px 0}table{border-collapse:collapse;width:100%;margin:10px 0}th,td{text-align:left;border-bottom:1px solid var(--edge);padding:8px;font-size:13px}.count{font-size:12px;color:var(--muted);margin:0 0 12px}.good{color:#8bcba3}.bad{color:#e5a293}.pending{color:#c6c1b8}.empty{padding:30px;color:var(--muted)}a{color:var(--accent)}@media(max-width:850px){header{padding:20px}.layout{grid-template-columns:1fr}aside{position:relative;height:auto;max-height:230px;border-right:0;border-bottom:1px solid var(--edge)}main{padding:20px 14px}.nav{display:inline-block;width:47%;vertical-align:top}.stats{gap:13px}h2{font-size:21px}}
</style></head><body><header><h1>H3 · 10月20日新增实验</h1><p class="muted">IVEBench · 01:00–11:09 完成的生成结果，附醒后完成的 __AFTER_WAKE__ 条生成结果。</p><div class="stats"><span><b>30</b>睡眠期间新成片</span><span><b>16</b>参考视频</span><span><b>6</b>固定引导配对</span><span><b>1</b>自动引导成片</span></div><p class="muted">每组展示同帧截图、完整有效片段、实际提示词与已有评分。固定引导、自动引导和位置编码试验分别标明。</p><div class="filters"><button id="paired" class="active">查看引导与结构对照</button><button id="all">查看全部新结果</button></div></header><div class="layout"><aside><p id="count" class="count"></p><div id="nav"></div></aside><main id="main"></main></div>
<script id="dataset" type="application/json">__DATA__</script><script>
'use strict';const DATA=JSON.parse(document.getElementById('dataset').textContent);const items=DATA.items;const byId=Object.fromEntries(items.map(x=>[x.id,x]));const urls=new Map();let mode='paired',current=DATA.default_version||'r138_short_0252_seed2026101703_visible_only';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function asset(key){if(!urls.has(key)){const a=DATA.assets[key],b=atob(a.b64),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);urls.set(key,URL.createObjectURL(new Blob([u],{type:a.mime})));}return urls.get(key)}
const fmt=n=>typeof n==='number'?n.toFixed(4):'待评测';const mark=v=>v===true?'<span class="good">✓</span>':v===false?'<span class="bad">✗</span>':'<span class="pending">待判定</span>';
function eligible(x){return mode==='all'||x.mode!=='native_only'}
function groups(){const g=new Map();for(const x of items.filter(eligible)){if(!g.has(x.source))g.set(x.source,[]);g.get(x.source).push(x)}return [...g.values()].sort((a,b)=>{if(a[0].source==='short_0252')return -1;if(b[0].source==='short_0252')return 1;return Math.max(...b.map(x=>x.completion))-Math.max(...a.map(x=>x.completion))})}
function navigate(){const g=groups();document.getElementById('count').textContent=`${g.length} 条参考视频 · ${items.filter(eligible).length} 个配置版本`;document.getElementById('nav').innerHTML=g.map(v=>{const chosen=v.find(x=>x.id===current)||v.find(x=>x.mode==='resumed_online_guidance')||v.find(x=>x.mode==='guided_pair')||v.reduce((a,b)=>a.completion>b.completion?a:b);return `<button class="nav ${byId[current]?.source===chosen.source?'active':''}" data-id="${chosen.id}">${esc(chosen.title)}<small>${chosen.source} · ${v.length} 个版本${v.every(x=>x.after_wake)?' · 醒后完成':''}</small></button>`}).join('');document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>show(b.dataset.id));}
function eventTable(x){if(x.event_table?.length)return `<table><thead><tr><th>动作阶段</th><th>参考帧</th><th>普通编辑</th><th>${esc(x.method)}</th></tr></thead><tbody>${x.event_table.map(e=>`<tr><td>${esc(e.name)}</td><td>${e.source_frames.map(esc).join('–')}</td><td>${e.native_frames.map(esc).join('–')}</td><td>${e.guided_frames.map(esc).join('–')}</td></tr>`).join('')}</tbody></table><p class="caption">从第 0 帧开始编号；区间覆盖可见动作转折与遮挡带来的边界歧义。</p>`;if(x.mode==='resumed_online_guidance')return `<table><thead><tr><th>动作阶段</th><th>参考帧</th><th>普通编辑</th><th>自动引导</th></tr></thead><tbody><tr><td>双手离膝向面罩靠拢</td><td>42–45</td><td>57–60</td><td>42–45</td></tr><tr><td>双手握住面罩</td><td>48–51</td><td>62–64</td><td>48–51</td></tr><tr><td>右手举带至上胸／脸侧</td><td>69–75</td><td>84–89</td><td>68–74</td></tr></tbody></table>`;return x.events.length?`<details><summary>动作时间记录</summary><pre>${esc(JSON.stringify(x.events,null,2))}</pre></details>`:''}
function show(id){const prev=document.querySelector('video');if(prev){prev.pause();prev.removeAttribute('src');prev.load()}current=id;const x=byId[id],variants=items.filter(y=>y.source===x.source&&eligible(y)).sort((a,b)=>b.completion-a.completion);const paired=x.mode!=='native_only';const kind=x.mode==='guided_pair'?'固定时序引导':x.method;const delta=x.mf.every(n=>typeof n==='number')?x.mf[1]-x.mf[0]:null;
document.getElementById('main').innerHTML=`<h2>${esc(x.title)}</h2><div class="badges"><span class="tag">IVEBench · ${x.source}</span><span class="tag">${esc(x.method)}</span><span class="tag">${esc(x.prompt_label)}</span><span class="tag">参考视频${x.reference_image?' + 参考图':'；无参考图'}</span></div><div class="status"><span>普通编辑：动作—时间对齐 ${mark(x.alignment[0])}</span>${paired?`<span>${esc(kind)}：动作—时间对齐 ${mark(x.alignment[1])}</span>`:''}</div><img class="media" id="still" src="${asset(x.still)}" alt="同帧对比截图"><p class="caption">同帧对比 · 第 ${x.still_frame} 帧 · ${(x.still_frame/x.fps).toFixed(3)} 秒</p><video class="media" id="video" src="${asset(x.video)}" controls playsinline preload="metadata"></video><p class="caption">${x.labels.map(esc).join('　｜　')} · 完整有效片段 ${x.frames} 帧 / ${x.fps} fps</p><div class="controls"><button id="play">播放／暂停</button><button data-step="-1">上一帧</button><button data-step="1">下一帧</button><label>速度 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label><button id="key">定位截图时刻</button>${x.mode==='resumed_online_guidance'?'<button data-jump="4">查看静止片段（第 4 帧）</button><button data-jump="44">查看抬手片段（第 44 帧）</button>':''}<span id="clock" class="muted"></span></div><div class="metrics"><div class="metric"><span>普通编辑 MF</span><b>${fmt(x.mf[0])}</b></div>${paired?`<div class="metric"><span>${esc(kind)} MF</span><b>${fmt(x.mf[1])}</b></div><div class="metric"><span>MF 变化</span><b>${delta===null?'待评测':(delta>=0?'+':'')+delta.toFixed(4)}</b></div>`:''}<div class="metric"><span>新增生成视频</span><b>${x.new_outputs}</b></div></div><p class="review">${esc(x.review)}</p><p class="caption">${esc(x.method_detail)}</p>${eventTable(x)}<div class="version"><label for="version">查看版本</label><select id="version">${variants.map(v=>`<option value="${v.id}" ${v.id===id?'selected':''}>${esc(v.method+' · '+v.variant)}</option>`).join('')}</select></div><details><summary>提示词与任务</summary><p class="muted">benchmark 编辑指令</p><pre>${esc(x.task)}</pre><p class="muted">本次实际输入</p><pre>${esc(x.prompt)}</pre></details>${x.mode==='resumed_online_guidance'?'<details><summary>自动引导与静态姿态检查</summary><p>本次在去噪步骤 1、3、4、10、14、17、18 开启引导，编号从 0 开始。每步先预测并检测，符合条件时从同一当前状态执行引导预测。</p><p>后四次触发涉及接近静止的第 4–19 帧。现有匹配收益主要来自平均手臂方向更接近；新增去均值检查正在测试。验收同时检查静态姿态、主要动作时间和编辑完成情况。</p></details>':''}<details><summary>指标与记录</summary><p>MF 为 IVE­Bench 官方 Motion Fidelity。上方对齐判断来自动作事件检查；评分采用完整有效片段。</p><p>实验 ${esc(x.id)} · 完成时间 ${esc(x.completion_cst.slice(0,19).replace('T',' '))}</p><p>生成完成数包含成功、失败和效果相近的编辑结果。该页共覆盖睡眠期间 ${DATA.summary.sleep_generated_outputs} 条新成片及醒后 ${DATA.summary.after_wake_generated_outputs} 条；对照视频可能复用此前已完成的普通编辑。</p></details>`;
const video=document.getElementById('video');document.getElementById('play').onclick=()=>video.paused?video.play():video.pause();document.getElementById('speed').onchange=e=>video.playbackRate=Number(e.target.value);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{video.pause();video.currentTime=Math.max(0,Math.min((x.frames-1)/x.fps,(Math.round(video.currentTime*x.fps)+Number(b.dataset.step))/x.fps))});document.getElementById('key').onclick=()=>{video.pause();video.currentTime=x.still_frame/x.fps};document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{video.pause();video.currentTime=Number(b.dataset.jump)/x.fps});video.ontimeupdate=()=>document.getElementById('clock').textContent=`第 ${Math.min(x.frames-1,Math.round(video.currentTime*x.fps))} 帧 / ${video.currentTime.toFixed(3)} 秒`;document.getElementById('version').onchange=e=>show(e.target.value);navigate();history.replaceState(null,'','#'+id);
}
document.getElementById('paired').onclick=()=>{mode='paired';document.getElementById('paired').classList.add('active');document.getElementById('all').classList.remove('active');show(eligible(byId[current])?current:DATA.default_version)};document.getElementById('all').onclick=()=>{mode='all';document.getElementById('all').classList.add('active');document.getElementById('paired').classList.remove('active');show(current)};const requested=decodeURIComponent(location.hash.slice(1));if(byId[requested]){current=requested;if(byId[current].mode==='native_only'){mode='all';document.getElementById('all').classList.add('active');document.getElementById('paired').classList.remove('active')}}show(current);
</script></body></html>
