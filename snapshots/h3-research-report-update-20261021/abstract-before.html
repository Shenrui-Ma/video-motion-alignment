<section id="abstract" class="abstract"><h2>摘要</h2><p>角色替换与外观编辑可能改变源视频中局部动作的发生时间，导致编辑结果与源动作在时间上错位。针对这一问题，我们在 MiniMax H3 上研究一种 training-free 的路由方法。在 DiT 的 MM Self-Attention 中将目标视频 query 对源视频的注意力限制在对应的 VAE 时间 bin 内，从而直接加强源视频特定时间的特征。目前大部分测试固定选择在7-15步引导（20步）。实验基于 FlexiAct 和 IVEBench 公开数据进行视频编辑任务，可以减小部分样例的局部动作时间误差，但改善主要提现在常规编辑后出现动作错误的任务结果。</p></section>
