<div id="h3-detailed-research-timeline">
<style>
#h3-detailed-research-timeline .heading{display:flex;align-items:center;flex-wrap:wrap;gap:14px;margin:12px 0;padding-right:92px}
#h3-detailed-research-timeline h3{margin:0}
#h3-detailed-research-timeline .controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
#h3-detailed-research-timeline .timeline-canvas{overflow-x:auto;overflow-y:hidden;width:100%;cursor:grab;touch-action:pan-x pan-y}
#h3-detailed-research-timeline .timeline-canvas.dragging{cursor:grabbing}
#h3-detailed-research-timeline .timeline{display:block;max-width:none;user-select:none}
#h3-detailed-research-timeline .timeline text{fill:var(--foreground);font-weight:400}
#h3-detailed-research-timeline .timeline .muted{fill:var(--muted-foreground)}
#h3-detailed-research-timeline .timeline .strong{font-weight:500}
#h3-detailed-research-timeline .timeline .node{fill:var(--background);stroke:var(--border);stroke-width:1;rx:5}
#h3-detailed-research-timeline .timeline .current{fill:color-mix(in srgb,var(--viz-series-1) 10%,var(--background))}
#h3-detailed-research-timeline .timeline .main-edge{stroke:var(--viz-series-1);stroke-width:2;fill:none}
#h3-detailed-research-timeline .timeline .branch-edge{stroke:var(--muted-foreground);stroke-width:1.4;fill:none}
#h3-detailed-research-timeline .timeline .divider{stroke:var(--border);stroke-width:1}
#h3-detailed-research-timeline .timeline .main-dot{fill:var(--viz-series-1)}
#h3-detailed-research-timeline .timeline .stopped-dot{fill:var(--viz-series-3)}
#h3-detailed-research-timeline .timeline .candidate-dot{fill:var(--viz-series-2)}
#h3-detailed-research-timeline .timeline .line-label-background{fill:var(--background)}
#h3-detailed-research-timeline .note{margin-top:10px}
#h3-detailed-research-timeline .method-details{margin-top:22px}
#h3-detailed-research-timeline .method-details details{margin:10px 0}
#h3-detailed-research-timeline .method-details p{max-width:1000px;margin:10px 0 10px 16px}
</style>
<div class="heading"><h3>H3 动作时间对齐：研究主线与分支</h3><span class="text-small text-muted">2026.10.12—10.21</span></div>
<div class="controls">
<button type="button" class="btn" data-action="previous" aria-label="查看前一阶段">← 前一阶段</button>
<button type="button" class="btn" data-action="next" aria-label="查看后一阶段">后一阶段 →</button>
<span class="text-small text-muted">左右拖动查看 · 上下分支标明尝试与去向</span>
</div>
<div class="timeline-canvas" aria-label="研究时间轴，支持横向拖动">__TIMELINE_SVG__</div>
<p class="note text-small text-muted">偏移统计：先计算每项任务的平均绝对偏移，再对 7 组延后任务等权平均。Sam 首段舞蹈采用手臂序列时差，其余采用事件帧差。</p>
<details class="method-details"><summary class="cursor-interaction">算法参数与完整实验记录</summary>__METHOD_DETAILS__</details>
</div>
<script>
(() => {
const root=document.getElementById('h3-detailed-research-timeline');
const canvas=root.querySelector('.timeline-canvas');
const previous=root.querySelector('[data-action="previous"]'),next=root.querySelector('[data-action="next"]');
const starts=__COLUMN_STARTS__;
let drag=null;
function sync(){previous.disabled=canvas.scrollLeft<=1;next.disabled=canvas.scrollLeft>=canvas.scrollWidth-canvas.clientWidth-1}
function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:null,privateContent:{scrollLeft:canvas.scrollLeft}}).catch(()=>{})}
function move(direction){
 const here=canvas.scrollLeft;
 const target=direction>0?starts.find(x=>x>here+4):[...starts].reverse().find(x=>x<here-4);
 canvas.scrollLeft=target??(direction>0?canvas.scrollWidth:0);sync();save();
}
previous.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));
canvas.addEventListener('scroll',sync,{passive:true});
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button===0){drag={id:e.pointerId,x:e.clientX,left:canvas.scrollLeft};canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging')}});
canvas.addEventListener('pointermove',e=>{if(drag&&drag.id===e.pointerId)canvas.scrollLeft=drag.left+drag.x-e.clientX});
function end(e){if(drag&&drag.id===e.pointerId){drag=null;canvas.classList.remove('dragging');if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);sync();save()}}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
canvas.addEventListener('lostpointercapture',()=>{drag=null;canvas.classList.remove('dragging')});
new ResizeObserver(sync).observe(canvas);
function restore(state){canvas.scrollLeft=Number(state?.privateContent?.scrollLeft)||0;sync()}
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState)});
restore(window.openai?.widgetState);
})();
</script>
