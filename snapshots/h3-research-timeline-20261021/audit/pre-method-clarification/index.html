&lt;script type=&quot;application/json&quot; id=&quot;codex-visualization-widget-state&quot;&gt;__CODEX_VISUALIZATION_WIDGET_STATE__&lt;/script&gt;
&lt;script&gt;(() =&gt; {
  const root = document.documentElement;
  const mediaQuery = globalThis.matchMedia(&quot;(prefers-color-scheme: dark)&quot;);
  const apply = Reflect.apply;
  const isArray = Array.isArray;
  const hasOwn = Object.hasOwn;
  const parentWindow = globalThis.parent;
  const stringify = JSON.stringify;
  const parse = JSON.parse;
  const encode = TextEncoder.prototype.encode.bind(new TextEncoder());
  const initialStateElement = document.getElementById(
    &quot;codex-visualization-widget-state&quot;,
  );
  const initialGlobals = parse(initialStateElement?.textContent ?? &quot;{}&quot;);
  initialStateElement?.remove();
  /** @type {Record&lt;string, unknown&gt; | null} */
  let state = initialGlobals.widgetState ?? null;
  const statePersistence = initialGlobals.statePersistence ?? &quot;none&quot;;
  let nextStateRequestId = 0;
  /** @type {Map&lt;number, { resolve: () =&gt; void; reject: (error: Error) =&gt; void; timeout: ReturnType&lt;typeof globalThis.setTimeout&gt;; serializedState: string }&gt;} */
  const pendingStateWrites = new Map();
  const persistenceError = () =&gt;
    Object.assign(
      new Error(&quot;The host could not persist the widget state update&quot;),
      {
        code: -32000,
        data: { code: &quot;widget_state_persistence_failed&quot;, retryable: false },
      },
    );
  /**
   * @param {object} prototype
   * @param {string} property
   */
  const getPrototypeGetter = (prototype, property) =&gt; {
    // oxlint-disable-next-line typescript/unbound-method -- invoked through captured Reflect.apply
    const getter = Object.getOwnPropertyDescriptor(prototype, property)?.get;
    if (getter == null) {
      throw new Error(`Missing ${property} getter`);
    }
    return getter;
  };
  const getMessageData = getPrototypeGetter(MessageEvent.prototype, &quot;data&quot;);
  const getMessagePorts = getPrototypeGetter(MessageEvent.prototype, &quot;ports&quot;);
  const getMessageSource = getPrototypeGetter(MessageEvent.prototype, &quot;source&quot;);
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const addHostMessageListener = MessagePort.prototype.addEventListener;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const postHostMessage = MessagePort.prototype.postMessage;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const startHostPort = MessagePort.prototype.start;
  // oxlint-disable-next-line typescript/unbound-method -- captured before the untrusted fragment runs
  const stopMessagePropagation = Event.prototype.stopImmediatePropagation;
  /** @type {MessagePort | null} */
  let hostPort = null;
  const postToHost = (type, payload) =&gt; {
    if (hostPort != null) {
      apply(postHostMessage, hostPort, [{ type, ...payload }]);
    }
  };
  const openExternal = ({ href }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;open-external&quot;, { href });
    }
  };
  const sendFollowUpMessage = ({ context, prompt, title }) =&gt; {
    if (globalThis.navigator.userActivation?.isActive === true) {
      postToHost(&quot;follow-up&quot;, { context, prompt, title });
    }
    return Promise.resolve();
  };
  /**
   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next
   * @returns {Promise&lt;void&gt;}
   */
  const setWidgetState = async (next) =&gt; {
    const nextState = typeof next === &quot;function&quot; ? next(state) : next;
    if (
      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const inputState = stringify(
      nextState,
      (_key, /** @type {unknown} */ value) =&gt; {
        if (
          typeof value === &quot;undefined&quot; ||
          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))
        ) {
          throw new TypeError(&quot;Widget state must be a JSON object&quot;);
        }
        return value;
      },
    );
    const parsedState = parse(inputState);
    if (
      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)
    ) {
      throw new TypeError(&quot;Widget state must be a JSON object&quot;);
    }
    const storedState = {
      modelContent: null,
      privateContent: null,
      ...parsedState,
    };
    const serializedState = stringify(storedState);
    if (encode(serializedState).length &gt; 16 * 1024) {
      throw new TypeError(
        &quot;Widget state must be a JSON object of at most 16 KiB&quot;,
      );
    }
    if (
      hasOwn(storedState, &quot;imageIds&quot;) &amp;&amp;
      (!isArray(storedState.imageIds) ||
        storedState.imageIds.some(
          (/** @type {unknown} */ id) =&gt; typeof id !== &quot;string&quot;,
        ))
    ) {
      throw new TypeError(&quot;Widget state imageIds must be an array of strings&quot;);
    }
    if (storedState.imageIds?.length &gt; 0) {
      throw Object.assign(
        new TypeError(&quot;Visualization state does not support image attachments&quot;),
        { code: -32602, data: { code: &quot;images_unsupported&quot; } },

    }

    globalThis.openai.widgetState = state;
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: { widgetState: state } },
      }),
    );
    if (statePersistence === &quot;none&quot;) {
      throw persistenceError();
    }
    const id = ++nextStateRequestId;
    return new Promise((resolve, reject) =&gt; {
      const timeout = globalThis.setTimeout(() =&gt; {
        pendingStateWrites.delete(id);
        reject(persistenceError());
      }, 30_000);
      pendingStateWrites.set(id, { resolve, reject, timeout, serializedState });
      postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
    });
  };
  const syncTheme = () =&gt; {
    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();
            } else if (
              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;
            ) {
              /** @type {unknown} */
              const id = data.id;
              if (typeof id !== &quot;number&quot;) {
                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);
                globalThis.clearTimeout(pending.timeout);
                if (data.ok === true) {
                  pending.resolve();
                } else {
                  pending.reject(persistenceError());
                }
              }
            }
          },
        ]);
        apply(startHostPort, nextHostPort, []);
      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );
  document.currentScript?.remove();
  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }
    let element = null;
    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });

  syncTheme();
})();

&lt;details class=&quot;timeline-node main&quot; data-node=&quot;question&quot; style=&quot;left:24px;top:376.0px;width:220px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-title&quot;&gt;问题：短动作修复&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;先确认短动作失真，再尝试增强参考信息。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;目标&lt;/strong&gt;用 H3 做 training-free 视频编辑，保留短动作的出现、姿态和发生时间。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;两轮集中实验&lt;/strong&gt;首轮 3 段真人、16 条输出，目标动作均保留。改选动作切换密集的 2 段真人＋1 段动画，再做 12 条、6 对输出。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;观察&lt;/strong&gt;动画近眼手势失真；真人更多出现约 15–17 帧延后。提示词强调有时会插入或延长动作。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node main&quot; data-node=&quot;weight&quot; style=&quot;left:344px;top:376.0px;width:240px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-status kept&quot; role=&quot;img&quot; aria-label=&quot;保留&quot;&gt;✓&amp;#xfe0e;&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;方法：局部参考加权&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;保留参考增强思路，进一步研究动作时间对应。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;方法&lt;/strong&gt;给生成 query → 目标动作片段参考 keys 的 logits 加 ln 2 或 ln 3，提高局部参考影响。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node main&quot; data-node=&quot;timing&quot; style=&quot;left:684px;top:376.0px;width:230px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-title&quot;&gt;问题：动作时间对齐&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;将首次编辑中的动作时间保持设为研究重点。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;问题调整&lt;/strong&gt;将动作是否出现、姿态是否正确、发生时间是否对齐分别记录；优先处理更常见的动作延后。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;比较方式&lt;/strong&gt;参考视频、普通编辑、引导编辑在相同帧号比较。普通与引导使用相同输入、提示词和种子。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;研究目标&lt;/strong&gt;在一次编辑推理中保持动作时间，同时完成换人、换装或物体编辑。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;调整依据&lt;/strong&gt;动画先试 2×、3×；随后两段真人舞蹈分别替换为 Musk / Sam，做普通编辑与 3× 加权，共 4 对、8 条。 流萤 2×、3× 均未恢复早期近眼动作；真人配对中，原本晚约 9–16 帧的动作接近参考时间。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node main&quot; data-node=&quot;operator&quot; style=&quot;left:1014px;top:376.0px;width:270px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-status kept&quot; role=&quot;img&quot; aria-label=&quot;保留&quot;&gt;✓&amp;#xfe0e;&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;方法：同时间 Attention&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;采用同时间参考约束，先以固定区间检验效果。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;作用位置&lt;/strong&gt;H3 单流 DiT 各 block 的 Attention head 输出，out_proj 之前。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;方法&lt;/strong&gt;生成视频 query 读取参考 K/V 时，保留分给整段参考视频的概率总和 mR，把其中 α 比例的 V 加权贡献改为同一 latent 时间 bin 的空间 tokens。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;公式&lt;/strong&gt;O′ = O + α mR (μsame − μall)。μall 是整段参考视频内部归一化的 V 加权和，μsame 是同时间 bin 内归一化的 V 加权和；mR 是原 Joint Attention 中该 query 分给全部参考视频 keys 的概率总和。bin 指 VAE 时间压缩后的 latent 时间索引。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node main&quot; data-node=&quot;fixed_test&quot; style=&quot;left:1384px;top:376.0px;width:270px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-title&quot;&gt;实验：固定 7–15 步引导&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;固定干预能够改善时序，继续扩大样本测试。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;实验设置&lt;/strong&gt;20 步采样，在第 7–15 步启用同时间 Attention，α=1；普通编辑和引导编辑保持输入、种子和提示词一致。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;结果&lt;/strong&gt;Sam 舞蹈主动作由晚 13 帧降至 1 帧，强引导伴随重影。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;区间的来源&lt;/strong&gt;早期 Sam 样例中，第 7–15 步与第 12–20 步同为 9 次引导；前者约剩 1 帧，后者仍晚 11–12 帧，随后沿用第 7–15 步。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;研究决策&lt;/strong&gt;保留同时间 Attention 干预，进入公开数据测试，同时尝试自动控制引导的开始和停止。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node main&quot; data-node=&quot;public&quot; style=&quot;left:1754px;top:376.0px;width:280px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-title&quot;&gt;实验：公开数据集固定引导&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;固定引导在更多样本上有效，继续比较区间与强度。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;FlexiAct 公开数据&lt;/strong&gt;输入参考动作视频＋目标参考图。从 human-to-human 公开配对中，选扩胸、下蹲、健身、单腿、转身五类的首个配对；首轮使用统一简短动作迁移指令。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;IVEBench 公开数据&lt;/strong&gt;输入原视频＋编辑指令。先看 12 条原片的局部动作可见性，选定 5 条角色／服饰任务，保留低幅度阅读对照；直接使用原始指令。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;实际先后&lt;/strong&gt;公开数据首轮先做普通编辑和自动控制尝试，IVEBench 五条自动版本均未触发。随后扩大固定第 7–15 步的配对测试，直接检验同时间 Attention 的作用。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;本节点的配置&lt;/strong&gt;使用固定第 7–15 步、α=1，直接开启干预；动作时间范围按具体实验配置。结果包含整段参考时间引导和局部时间范围引导。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;样本选择&lt;/strong&gt;先检查基础编辑是否完成，再在动作清楚且有时间偏移的样本上做同条件配对；保留原本接近同步的样本作对照。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;提示词沿革&lt;/strong&gt;早期部分实验使用六段结构提示词。后续按约定改用 benchmark 原指令或简短任务指令；每一对普通编辑与引导编辑保持提示词相同。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;实验结果&lt;/strong&gt;机舱人物替换、饮酒加眼镜等样本出现动作时间改善；书本、手帕等样本改善程度不同。部分基础编辑失败，需先解决任务完成问题。MF 与局部动作对齐也出现分歧。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;研究决策&lt;/strong&gt;保留同时间 Attention，接下来用已跑通任务比较引导区间、强度和覆盖范围。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node main&quot; data-node=&quot;schedules&quot; style=&quot;left:2134px;top:376.0px;width:280px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-title&quot;&gt;实验：十组引导区间对照&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;全程弱引导最好；固定区间中，第 1–9 步最好。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;五种配置&lt;/strong&gt;α=1：第 1–9、7–15、12–20、1–4＋16–20 步；α=0.25：全 20 步。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;两批集中推理&lt;/strong&gt;R149：3 项任务、新增 12 条。R150：再加 7 项任务、新增 33 条；合计 10 项任务、9 条独立参考视频。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;任务组成&lt;/strong&gt;7 组动作延后、2 组原本近同步、1 组短动作遗漏。平均偏移排名使用其中 7 组延后任务。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;结果&lt;/strong&gt;早期和分段强引导改善时间，但饮酒样例构图改变；全程弱引导保持了十组基础编辑。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;完整排名&lt;/strong&gt;7 组延后任务的平均绝对偏移：普通编辑 11.40 帧；全程弱引导 0.33 帧；第 1–9 步 0.86 帧；前后分段 2.18 帧；第 7–15 步 4.22 帧；第 12–20 步 11.31 帧。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;编辑完成&lt;/strong&gt;全程弱引导 10/10；第 1–9 步和前后分段各 9/10。早期或分段强引导在饮酒样本改变了构图。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;研究决策&lt;/strong&gt;优先采用全程弱引导，固定区间对照保留第 1–9 步。后续重心转为强度与覆盖范围。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node current&quot; data-node=&quot;weak&quot; style=&quot;left:2514px;top:376.0px;width:250px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-status kept&quot; role=&quot;img&quot; aria-label=&quot;保留&quot;&gt;✓&amp;#xfe0e;&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;方法：全程弱引导&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;作为当前优先方案，继续细化引导强度与覆盖范围。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;方法&lt;/strong&gt;同一 Attention 算子覆盖全部有效视频时间、全 20 个采样步；每步仅替换 25% 的参考组贡献。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;下一步&lt;/strong&gt;比较引导强度与时间覆盖的组合，并考虑与双向 Attention 结构候选组合。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node main&quot; data-node=&quot;rgb_method&quot; style=&quot;left:834.0px;top:194px;width:270px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-status discarded&quot; role=&quot;img&quot; aria-label=&quot;废案&quot;&gt;✕&amp;#xfe0e;&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;方法：RGB 姿态反馈&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;尝试自动选窗与起停，减少手工指定引导区间。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;模型与信号&lt;/strong&gt;由当前带噪 latent 和模型速度预测得到的 clean latent → VAE 解码 → YOLOX 人体检测＋DWPose。比较肩、肘、腕构成的手臂方向，在全片扫描 16／32 帧窗口。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;开启与停止&lt;/strong&gt;两组置信阈值的时差估计相差 ≤2 帧、均晚 &amp;gt;2 帧；候选时移相对 ±2 帧容差范围的姿态误差下降 &amp;gt;50%。同部位重叠 ≥50% 的窗口连续两步成立才开启，证据消失时停止；可靠支持不足 80% 记为 UNKNOWN。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node stopped&quot; data-node=&quot;rgb_test&quot; style=&quot;left:824.0px;top:12px;width:290px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-status discarded&quot; role=&quot;img&quot; aria-label=&quot;废案&quot;&gt;✕&amp;#xfe0e;&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;实验：RGB 自动控制&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;推理耗时过高，逐步解码与姿态检测路线废案。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;先前原型&lt;/strong&gt;最早先测试过跨 5 个时间 bin 差分的 latent 粗停止器；其在线控制停止过早，随后转向 RGB 姿态反馈。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;控制器演变&lt;/strong&gt;先固定早期引导，再用 RGB 姿态决定后段是否停止；随后扩展为全片扫描、自动选择动作窗口和自动起停。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;开发与公开测试&lt;/strong&gt;开发舞蹈出现 13→2、15→−1 帧改善；IVE 首批 5 条全部零触发。可见手臂版重放也未新增触发。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;耗时&lt;/strong&gt;每步观察额外约 215–228 秒，包含完整解码与逐帧姿态处理。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;研究决策&lt;/strong&gt;停止每步完整 VAE 解码与 DWPose 反馈。保留时序干预算子，改为研究低成本 latent 运动信号。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node main&quot; data-node=&quot;latent_method&quot; style=&quot;left:1194.0px;top:194px;width:270px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-status pending&quot; role=&quot;img&quot; aria-label=&quot;候选／待下一步&quot;&gt;❚❚&amp;#xfe0e;&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;方法：latent 运动反馈&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;重新研究无需逐步解码的自动控制信号。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;算法&lt;/strong&gt;复用 clean latent：时间差分＋局部 cosine 互近邻 patch 匹配，估计位移。按 4×4 空间网格扫描短窗口，再与参考估计时差。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;候选筛选&lt;/strong&gt;搜索 ±6 bin；归一化 MSE≤0.5、共同支持≥80%、最优与次优的相对间隔≥0.1。差分分支另试 t mod 5 相位去均值。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;版本区别&lt;/strong&gt;早期在线粗停止器使用跨 5 bin 差分；后续版本增加局部空间匹配与短窗口扫描，作为新的运动观察器候选。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node candidate&quot; data-node=&quot;latent_test&quot; style=&quot;left:1184.0px;top:12px;width:290px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-status pending&quot; role=&quot;img&quot; aria-label=&quot;候选／待下一步&quot;&gt;❚❚&amp;#xfe0e;&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;实验：latent 检测验证&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;保留候选，先消除周期性误判，再接入在线控制。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;早期在线尝试&lt;/strong&gt;在中间预测 clean latent 上取跨 5 个时间 bin 的差分，搜索 ±24 帧时差。 估计延后 ≥4 帧时开启；进入 ±2 帧时停止。 停止过早，成片仍晚 3–4 帧；固定引导约剩 1 帧。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;后续离线实验&lt;/strong&gt;同一条饮酒轨迹的 10 个中间端点，无新增模型前向。全局版中位 0.15 秒/步，局部扫描版中位 1.26 秒/步。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;结果&lt;/strong&gt;检出部分局部延后，同时出现 ±5 bin 周期假峰；控制器尚未接入这一路径。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;研究决策&lt;/strong&gt;继续改进 latent 时差估计。新的观察器仍处于离线候选阶段，下一步是消除周期性误判后接入在线控制。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node main&quot; data-node=&quot;spatial_method&quot; style=&quot;left:1579.0px;top:558px;width:270px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-status discarded&quot; role=&quot;img&quot; aria-label=&quot;废案&quot;&gt;✕&amp;#xfe0e;&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;方法：空间对应修正&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;沿空间对应调整参考特征，尝试改善动作约束。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;两种方法&lt;/strong&gt;沿时间求和参考 Attention，保留空间概率，再读取对应时刻的 Value；或用跨 head 平均余弦相似度，在相邻时间 bin 建立互近邻空间匹配，向目标时刻移动一步 Value。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node stopped&quot; data-node=&quot;spatial_test&quot; style=&quot;left:1569.0px;top:765px;width:290px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-status discarded&quot; role=&quot;img&quot; aria-label=&quot;废案&quot;&gt;✕&amp;#xfe0e;&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;实验：空间对应对照&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;时序改善未持续且内容发生变化，停止该轮配置。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;集中实验&lt;/strong&gt;同一个改黑衣样例，做空间概率保持、固定空间移动、特征匹配移动，共 3 条输出。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;结果&lt;/strong&gt;空间概率保持版改变人物绕行路径并丢失书本；匹配版仍保留后段动作延后。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;补充观察&lt;/strong&gt;固定空间移动提前了一个局部事件，后续仍有延后；互近邻匹配版整体接近普通编辑。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;研究决策&lt;/strong&gt;结束这轮空间概率与 Value 移动配置，主线继续使用同时间 Attention。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node main&quot; data-node=&quot;rope_method&quot; style=&quot;left:1939.0px;top:558px;width:270px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-status discarded&quot; role=&quot;img&quot; aria-label=&quot;废案&quot;&gt;✕&amp;#xfe0e;&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;方法：RoPE 时间对齐&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;分别测试主 Attention 坐标与辅助参考分支相位。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;主 Attention&lt;/strong&gt;对齐生成序列与参考序列的 RoPE 时间原点，生成 Q/K 同时变化。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;辅助参考分支&lt;/strong&gt;按两序列时间原点差旋转额外参考 Attention 中的生成 query；原 Joint Attention 的 Q/K 保持原值，参考 K/V 沿用原张量。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node stopped&quot; data-node=&quot;rope_test&quot; style=&quot;left:1929.0px;top:765px;width:290px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-status discarded&quot; role=&quot;img&quot; aria-label=&quot;废案&quot;&gt;✕&amp;#xfe0e;&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;实验：RoPE 组合对照&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;组合未增加时序收益，停止当前相位配置。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;主 Attention 时间原点&lt;/strong&gt;把生成与参考序列的 RoPE 时间起点对齐，生成 Q/K 同时改变。书本 1 例：动作时间改善，蓝色编辑失败。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;辅助参考分支相位&lt;/strong&gt;仅在辅助参考 Attention 中，按两序列时间原点差旋转生成 query；原 Joint Attention 的 Q/K 保持原值，参考 K/V 沿用原张量。书本 1 例完成改色，动作时间与普通编辑一致。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;与时序引导组合复测&lt;/strong&gt;在机舱、饮酒、书本、手帕、Sam 舞蹈 5 组比较引导与引导＋相位：4 组无额外收益，Sam 延后由 1 帧增至 12 帧。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;研究决策&lt;/strong&gt;在已验证有效的五组样本中完成引导与引导＋相位复测后，停止当前相位配置，沿用原同时间引导。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node main&quot; data-node=&quot;dual_method&quot; style=&quot;left:2319.0px;top:558px;width:270px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-status pending&quot; role=&quot;img&quot; aria-label=&quot;候选／待下一步&quot;&gt;❚❚&amp;#xfe0e;&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;方法：双向时间 Attention&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;扩展参考与生成之间的时间约束，测试反馈作用。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;新增反向约束&lt;/strong&gt;正向：生成 query → 参考 K/V。反向：参考 query → 生成 K/V。两向分别将概率重分配到同时间 bin，保留各自的视频组概率总和。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;传播位置&lt;/strong&gt;两项使用同一次 Q/K/V，在 out_proj 前分别修正生成与参考 token。反向项更新参考 hidden states，再经后续 DiT block 影响生成。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;details class=&quot;timeline-node candidate&quot; data-node=&quot;dual_test&quot; style=&quot;left:2309.0px;top:765px;width:290px&quot;&gt;&lt;summary class=&quot;cursor-interaction&quot;&gt;&lt;span class=&quot;node-heading&quot;&gt;&lt;span class=&quot;node-status pending&quot; role=&quot;img&quot; aria-label=&quot;候选／待下一步&quot;&gt;❚❚&amp;#xfe0e;&lt;/span&gt;&lt;span class=&quot;node-title&quot;&gt;实验：双向引导对照&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;node-conclusion&quot;&gt;保留结构改进候选，下一步测试与弱引导组合。&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;node-content&quot;&gt;&lt;p&gt;&lt;strong&gt;集中实验&lt;/strong&gt;3 组各增加仅反向（α=0，β=1）与双向（α=β=1）版本，共 6 条；第 1–9 步开启。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;结果&lt;/strong&gt;饮酒平均事件误差由仅正向 3 帧降至双向 2 帧，构图保持改善；机舱与 Sam 时间接近正向版本。三组 MF 均高于对应正向版本。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;与全程弱引导的关系&lt;/strong&gt;饮酒样本全程弱引导约 1.3 帧，双向引导约 2 帧。双向方案目前的额外价值主要在构图与 MF，尚未完成与全程弱引导的组合试验。&lt;/p&gt;&lt;p&gt;&lt;strong&gt;研究决策&lt;/strong&gt;保留双向 Attention 作为结构改进候选，计划在全程弱引导上继续验证。&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;/div&gt;

  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const sizeStorageKey = `${storageKey}:share-size-v1`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const persistSize = () => {
    globalThis.clearTimeout(sizeWriteTimeout);
    if (pendingSize == null) {
      return;
    }
    try {
      storage?.setItem(sizeStorageKey, pendingSize);
    } catch {
      // A denied or full cache must not affect the visualization.
    }
    pendingSize = null;
  };
  if (isShare) {
    globalThis.addEventListener("pagehide", persistSize);
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height !== "number" ||
        !Number.isFinite(height) ||
        height < 0
      ) {
        return;
      }
      if (height <= 10_000) {
        const width = isShare && storage != null ? frame.clientWidth : null;
        frame.style.height = Math.ceil(height) + "px";
        if (isShare && storage != null) {
          const size = JSON.stringify({
            fingerprint: sizeFingerprint,
            width,
            viewportHeight: globalThis.innerHeight,
            dark: globalThis.matchMedia("(prefers-color-scheme: dark)").matches,
            scale: globalThis.devicePixelRatio,
            height: Math.ceil(height),
          });
          if (size !== lastSize) {
            lastSize = size;
            pendingSize = size;
            globalThis.clearTimeout(sizeWriteTimeout);
            sizeWriteTimeout = globalThis.setTimeout(persistSize, 100);
          }
        }
      }
      if (isShare) {
        // Keep unusually tall content accessible without accepting an unbounded height.
        if (height > 10_000 && Number.parseFloat(frame.style.height) === 0) {
          frame.style.removeProperty("height");
        }
        frame.scrolling = height > 10_000 ? "auto" : "no";
        document.documentElement.classList.add("visualization-share-ready");
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!isShare && (!Number.isFinite(height) || height <= viewportHeight)) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  const frameHtml = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  if (isShare && storage != null) {
    // Fingerprint the rendered document, including restored widget state, without
    // storing its content. This is a layout cache, not a security identity.
    let hash = 5381;
    for (let index = 0; index < frameHtml.length; index += 1) {
      hash = (hash * 33 + frameHtml.charCodeAt(index)) % 4_294_967_296;
    }
    sizeFingerprint = hash.toString(36);
    try {
      const size = JSON.parse(storage.getItem(sizeStorageKey) ?? "null");
      if (
        size?.fingerprint === sizeFingerprint &&
        size.width === frame.clientWidth &&
        size.viewportHeight === globalThis.innerHeight &&
        size.dark ===
          globalThis.matchMedia("(prefers-color-scheme: dark)").matches &&
        size.scale === globalThis.devicePixelRatio &&
        typeof size.height === "number" &&
        Number.isFinite(size.height) &&
        size.height >= 0 &&
        size.height <= 10_000
      ) {
        frame.style.height = size.height + "px";
      }
    } catch {
      // Ignore missing or invalid cache entries and measure the live frame.
    }
  }
  frame.srcdoc = frameHtml;
  delete frame.dataset.srcdoc;
})();
</script>
</body>
