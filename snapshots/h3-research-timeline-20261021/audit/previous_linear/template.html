<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H3 动作时序研究 · 关键决策时间轴</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#20313b;background:#fafbfc}*{box-sizing:border-box}body{margin:0}main{max-width:1600px;margin:0 auto;padding:42px 36px 52px}.masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:1px solid #dce2e6;padding-bottom:24px}h1{font-size:30px;letter-spacing:-.03em;line-height:1.3;font-weight:650;margin:0}h1 span{display:block;font-size:16px;font-weight:400;color:#687783;margin-top:8px;letter-spacing:0}.period{font-size:14px;font-variant-numeric:tabular-nums;color:#687783;white-space:nowrap;margin:0}.navigation{display:flex;justify-content:space-between;align-items:center;margin:21px 0 12px;color:#71808b;font-size:13px}.arrows{display:flex;gap:8px}button{background:#fff;color:#2f4655;border:1px solid #cbd4da;border-radius:5px;width:37px;height:32px;font-size:20px;cursor:pointer}button:disabled{opacity:.3;cursor:default}button:hover:not(:disabled){background:#eef3f6}.chart-scroll{background:white;border:1px solid #dce2e6;border-radius:8px;overflow-x:auto;overflow-y:hidden;cursor:grab;touch-action:pan-x pan-y;scrollbar-width:auto;scrollbar-color:#aab8c1 #eef2f4}.chart-scroll:active{cursor:grabbing}.chart-scroll:focus-visible{outline:2px solid #317785;outline-offset:4px}.timeline{display:block;width:2796px;height:356px;max-width:none;user-select:none}.timeline text{font-family:"Arial Unicode MS","PingFang SC","Microsoft YaHei",sans-serif;pointer-events:none}.chart-scroll::-webkit-scrollbar{height:12px}.chart-scroll::-webkit-scrollbar-track{background:#eef2f4}.chart-scroll::-webkit-scrollbar-thumb{background:#aab8c1;border:3px solid #eef2f4;border-radius:9px}.footer{font-size:12px;color:#7b8993;margin-top:18px}
@media(max-width:650px){main{padding:25px 16px 36px}.masthead{display:block}h1{font-size:26px}.period{margin-top:18px}.timeline{width:2796px}.navigation{font-size:12px}}
@media print{main{padding:0}.navigation{display:none}.chart-scroll{overflow:visible;border:0}.timeline{width:100%;height:auto}.masthead{padding-bottom:12px}.footer{margin-top:12px}}
</style>
</head>
<body><main>
<header class="masthead"><h1>H3 动作时序研究<span>关键决策时间轴</span></h1><p class="period">2026.10.12 — 10.21</p></header>
<div class="navigation"><span>左右拖动，按时间顺序查看</span><div class="arrows"><button id="previous" type="button" aria-label="向前查看">←</button><button id="next" type="button" aria-label="向后查看">→</button></div></div>
<div class="chart-scroll" id="chart" tabindex="0" aria-label="研究决策时间轴，可拖动或按左右方向键滚动">__TIMELINE__</div>
<p class="footer">截至 2026年10月21日</p>
</main>
<script id="timeline-data" type="application/json">__DATA__</script>
<script>
const chart=document.getElementById('chart');
const previous=document.getElementById('previous');
const next=document.getElementById('next');
function updateButtons(){previous.disabled=chart.scrollLeft<=1;next.disabled=chart.scrollLeft>=chart.scrollWidth-chart.clientWidth-1}
function move(direction){chart.scrollBy({left:direction*Math.max(346,chart.clientWidth*.8),behavior:'smooth'})}
previous.addEventListener('click',()=>move(-1));
next.addEventListener('click',()=>move(1));
chart.addEventListener('scroll',updateButtons,{passive:true});
window.addEventListener('resize',updateButtons);
chart.addEventListener('keydown',event=>{if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();move(event.key==='ArrowLeft'?-1:1)}});
let drag=null;
chart.addEventListener('pointerdown',event=>{if(event.pointerType==='mouse'&&event.button===0){drag={id:event.pointerId,x:event.clientX,left:chart.scrollLeft};chart.setPointerCapture(event.pointerId)}});
chart.addEventListener('pointermove',event=>{if(drag&&event.pointerId===drag.id){chart.scrollLeft=drag.left-(event.clientX-drag.x)}});
function endDrag(event){if(drag&&event.pointerId===drag.id){if(chart.hasPointerCapture(event.pointerId))chart.releasePointerCapture(event.pointerId);drag=null}}
chart.addEventListener('pointerup',endDrag);
chart.addEventListener('pointercancel',endDrag);
chart.addEventListener('lostpointercapture',()=>{drag=null});
updateButtons();
</script>
</body></html>
