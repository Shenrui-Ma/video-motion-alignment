<svg xmlns="http://www.w3.org/2000/svg" class="timeline" viewBox="0 0 2796 356" role="img" aria-labelledby="timeline-title timeline-desc">
<title id="timeline-title">H3 动作时序研究关键决策时间轴</title>
<desc id="timeline-desc">八个按时间排列的研究节点，通过一条从左向右的箭头连接：短动作保真、参考加权、动作时间对齐、同时间Attention、自动启停、RoPE、区间对照、全程弱引导。</desc>
<rect width="2796" height="356" fill="#ffffff"/>
<g id="n01" aria-label="10.12–13，短动作保真立项。用 H3 做 training-free 视频编辑。选取动作切换密集的真人与动画，观察到手势失真和动作延后。开始尝试推理引导">
<rect x="35" y="50" width="304" height="256" rx="7" fill="#ffffff" stroke="#c9d5dd" stroke-width="1"/>
<rect x="55" y="70" width="25" height="22" rx="3" fill="#37647e"/>
<text x="60" y="73" dominant-baseline="text-before-edge" font-size="12" fill="#ffffff">01</text>
<text x="91" y="72" dominant-baseline="text-before-edge" font-size="14" fill="#6a7e8b">10.12–13</text>
<text x="55" y="110" dominant-baseline="text-before-edge" font-size="18" fill="#213f50">短动作保真立项</text>
<text x="55" y="155" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">用 H3 做 training-free 视频编辑。</text>
<text x="55" y="184" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">选取动作切换密集的真人与动画，</text>
<text x="55" y="213" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">观察到手势失真和动作延后。</text>
<rect x="55" y="254" width="264" height="1" rx="0" fill="#dfe7ec"/>
<text x="55" y="269" dominant-baseline="text-before-edge" font-size="14" fill="#37647e">开始尝试推理引导</text>
</g>
<path d="M346 178.0 H373 M367 173.0 L373 178.0 L367 183.0" fill="none" stroke="#9baab4" stroke-width="1.5"/>
<g id="n02" aria-label="10.13–15，局部参考加权。将短动作对应的参考权重提高至 2 倍、3 倍。四组真人换人实验中，动作时间得到改善。继续检查动作发生时间">
<rect x="381" y="50" width="304" height="256" rx="7" fill="#ffffff" stroke="#c9d5dd" stroke-width="1"/>
<rect x="401" y="70" width="25" height="22" rx="3" fill="#37647e"/>
<text x="406" y="73" dominant-baseline="text-before-edge" font-size="12" fill="#ffffff">02</text>
<text x="437" y="72" dominant-baseline="text-before-edge" font-size="14" fill="#6a7e8b">10.13–15</text>
<text x="401" y="110" dominant-baseline="text-before-edge" font-size="18" fill="#213f50">局部参考加权</text>
<text x="401" y="155" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">将短动作对应的参考权重提高</text>
<text x="401" y="184" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">至 2 倍、3 倍。四组真人换人</text>
<text x="401" y="213" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">实验中，动作时间得到改善。</text>
<rect x="401" y="254" width="264" height="1" rx="0" fill="#dfe7ec"/>
<text x="401" y="269" dominant-baseline="text-before-edge" font-size="14" fill="#37647e">继续检查动作发生时间</text>
</g>
<path d="M692 178.0 H719 M713 173.0 L719 178.0 L713 183.0" fill="none" stroke="#9baab4" stroke-width="1.5"/>
<g id="n03" aria-label="10.15，转向动作时间对齐。时间错位比动作遗漏更常见。将研究目标改为：编辑主体后，让动作与参考视频同时发生。确定研究主线">
<rect x="727" y="50" width="304" height="256" rx="7" fill="#ffffff" stroke="#c9d5dd" stroke-width="1"/>
<rect x="747" y="70" width="25" height="22" rx="3" fill="#37647e"/>
<text x="752" y="73" dominant-baseline="text-before-edge" font-size="12" fill="#ffffff">03</text>
<text x="783" y="72" dominant-baseline="text-before-edge" font-size="14" fill="#6a7e8b">10.15</text>
<text x="747" y="110" dominant-baseline="text-before-edge" font-size="18" fill="#213f50">转向动作时间对齐</text>
<text x="747" y="155" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">时间错位比动作遗漏更常见。</text>
<text x="747" y="184" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">将研究目标改为：编辑主体后，</text>
<text x="747" y="213" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">让动作与参考视频同时发生。</text>
<rect x="747" y="254" width="264" height="1" rx="0" fill="#dfe7ec"/>
<text x="747" y="269" dominant-baseline="text-before-edge" font-size="14" fill="#37647e">确定研究主线</text>
</g>
<path d="M1038 178.0 H1065 M1059 173.0 L1065 178.0 L1059 183.0" fill="none" stroke="#9baab4" stroke-width="1.5"/>
<g id="n04" aria-label="10.16，建立同时间 Attention 引导。保留参考总 Attention 概率，向对应时间的参考特征分配权重。固定第 7–15 步引导：13 → 1 帧。保留为核心方法">
<rect x="1073" y="50" width="304" height="256" rx="7" fill="#ffffff" stroke="#c9d5dd" stroke-width="1"/>
<rect x="1093" y="70" width="25" height="22" rx="3" fill="#37647e"/>
