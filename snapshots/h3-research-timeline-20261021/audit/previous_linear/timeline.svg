<text x="1129" y="72" dominant-baseline="text-before-edge" font-size="14" fill="#6a7e8b">10.16</text>
<text x="1093" y="110" dominant-baseline="text-before-edge" font-size="18" fill="#213f50">建立同时间 Attention 引导</text>
<text x="1093" y="155" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">保留参考总 Attention 概率，</text>
<text x="1093" y="184" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">向对应时间的参考特征分配权重。</text>
<text x="1093" y="213" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">固定第 7–15 步引导：13 → 1 帧。</text>
<rect x="1093" y="254" width="264" height="1" rx="0" fill="#dfe7ec"/>
<text x="1093" y="269" dominant-baseline="text-before-edge" font-size="14" fill="#37647e">保留为核心方法</text>
</g>
<path d="M1384 178.0 H1411 M1405 173.0 L1411 178.0 L1405 183.0" fill="none" stroke="#9baab4" stroke-width="1.5"/>
<g id="n05" aria-label="10.17–20，尝试自动选窗与启停。根据生成状态选择窗口、启停引导。公开数据触发不足；逐步 VAE解码与姿态检测开销过大。逐步 RGB 观察器归为废案">
<rect x="1419" y="50" width="304" height="256" rx="7" fill="#ffffff" stroke="#c9d5dd" stroke-width="1"/>
<rect x="1439" y="70" width="25" height="22" rx="3" fill="#945e46"/>
<text x="1444" y="73" dominant-baseline="text-before-edge" font-size="12" fill="#ffffff">05</text>
<text x="1475" y="72" dominant-baseline="text-before-edge" font-size="14" fill="#6a7e8b">10.17–20</text>
<text x="1439" y="110" dominant-baseline="text-before-edge" font-size="18" fill="#213f50">尝试自动选窗与启停</text>
<text x="1439" y="155" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">根据生成状态选择窗口、启停引导。</text>
<text x="1439" y="184" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">公开数据触发不足；逐步 VAE</text>
<text x="1439" y="213" dominant-baseline="text-before-edge" font-size="16" fill="#465d6b">解码与姿态检测开销过大。</text>
<rect x="1439" y="254" width="264" height="1" rx="0" fill="#dfe7ec"/>
