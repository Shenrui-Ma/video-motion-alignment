</g>
<path d="M1730 178.0 H1757 M1751 173.0 L1757 178.0 L1751 183.0" fill="none" stroke="#9baab4" stroke-width="1.5"/>
<g id="n06" aria-label="10.20，尝试 RoPE 时间对齐。调整时间原点与参考分支相位，回到五组有效案例复测。四组无额外收益；Sam 偏移 1 → 12 帧。未沿用，继续原引导方法">
