<text x="622.0" y="376.0" class="label-title strong" dominant-baseline="middle" text-anchor="start">聚焦动作时间对齐</text>
<text x="622.0" y="407.0" class="label-body " dominant-baseline="middle" text-anchor="start">目标 · 首次编辑中保持参考动</text>
<text x="622.0" y="426.0" class="label-body " dominant-baseline="middle" text-anchor="start">作时间。</text>
<text x="622.0" y="453.0" class="label-body " dominant-baseline="middle" text-anchor="start">对照 · 输入、提示词、种子相</text>
<text x="622.0" y="472.0" class="label-body " dominant-baseline="middle" text-anchor="start">同，分开检查编辑、姿态与时</text>
<text x="622.0" y="491.0" class="label-body " dominant-baseline="middle" text-anchor="start">差。</text>
