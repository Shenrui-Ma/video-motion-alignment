<g id="question"><rect x="24" y="345.5" width="220" height="193" class="node main"/>
<text x="38.0" y="361.5" class="label-small muted" dominant-baseline="middle" text-anchor="start">10.12–13</text>
<text x="38.0" y="385.5" class="label-title strong" dominant-baseline="middle" text-anchor="start">短动作保真</text>
<text x="38.0" y="416.5" class="label-body " dominant-baseline="middle" text-anchor="start">实验 · 首轮 16 条；密集动作</text>
<text x="38.0" y="435.5" class="label-body " dominant-baseline="middle" text-anchor="start">再测 12 条、6 对。</text>
<text x="38.0" y="462.5" class="label-body " dominant-baseline="middle" text-anchor="start">结果 · 动画手势失真，真人晚</text>
<text x="38.0" y="481.5" class="label-body " dominant-baseline="middle" text-anchor="start">15–17 帧；转向推理引导。</text>
