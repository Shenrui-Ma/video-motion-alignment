</g>
<g id="weight"><rect x="306" y="336.0" width="240" height="212" class="node main"/>
<text x="320.0" y="352.0" class="label-small muted" dominant-baseline="middle" text-anchor="start">10.13–15</text>
<text x="320.0" y="376.0" class="label-title strong" dominant-baseline="middle" text-anchor="start">局部参考加权</text>
<text x="320.0" y="407.0" class="label-body " dominant-baseline="middle" text-anchor="start">方法 · 目标片段参考 logits 加 ln 2</text>
<text x="320.0" y="426.0" class="label-body " dominant-baseline="middle" text-anchor="start">／ln 3。</text>
<text x="320.0" y="453.0" class="label-body " dominant-baseline="middle" text-anchor="start">结果 · 动画近眼动作未恢复；真</text>
<text x="320.0" y="472.0" class="label-body " dominant-baseline="middle" text-anchor="start">人 4 对、8 条中，9–16 帧延后缩</text>
<text x="320.0" y="491.0" class="label-body " dominant-baseline="middle" text-anchor="start">小。</text>
<path d="M320 511.0 H532" class="divider"/>
<circle cx="323" cy="526.0" r="3" class="main-dot"/>
<text x="333.0" y="526.0" class="label-small " dominant-baseline="middle" text-anchor="start">继续研究参考特征的时间对应</text>
</g>
