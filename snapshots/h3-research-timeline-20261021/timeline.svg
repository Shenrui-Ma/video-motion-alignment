</g>
<g id="operator"><rect x="890" y="322.5" width="270" height="239" class="node main"/>
<text x="904.0" y="338.5" class="label-small muted" dominant-baseline="middle" text-anchor="start">10.16</text>
<text x="904.0" y="362.5" class="label-title strong" dominant-baseline="middle" text-anchor="start">同时间 Attention 引导</text>
<text x="904.0" y="393.5" class="label-body " dominant-baseline="middle" text-anchor="start">方法 · DiT Attention 输出、out_proj</text>
<text x="904.0" y="412.5" class="label-body " dominant-baseline="middle" text-anchor="start">前，保留参考组总概率 mR，替换为同</text>
<text x="904.0" y="431.5" class="label-body " dominant-baseline="middle" text-anchor="start">时间 bin 的 V 加权和。</text>
<text x="904.0" y="458.5" class="label-body " dominant-baseline="middle" text-anchor="start">公式 · O′ = O + α mR (μsame − μall)</text>
<text x="904.0" y="485.5" class="label-body " dominant-baseline="middle" text-anchor="start">结果 · 第 7–15 步 α=1，Sam 13→1 帧</text>
<text x="904.0" y="504.5" class="label-body " dominant-baseline="middle" text-anchor="start">；伴随重影。</text>
<path d="M904 524.5 H1146" class="divider"/>
<circle cx="907" cy="539.5" r="3" class="main-dot"/>
<text x="917.0" y="539.5" class="label-small " dominant-baseline="middle" text-anchor="start">保留算子，比较时机与强度</text>
</g>
