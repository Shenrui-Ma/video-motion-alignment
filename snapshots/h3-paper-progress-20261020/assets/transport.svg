<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 390" role="img" aria-label="相邻时间Value输运及匹配空间位置示意" style="font-family:Arial, PingFang SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="24" y="30" font-size="23" fill="#243448" text-anchor="start" font-weight="600">参考视频 latent patch 的 Value 特征对应</text><rect x="35" y="61" width="320" height="150" rx="9" fill="#f7f9fc" stroke="#c8d2dd"/><text x="195.0" y="143.0" font-size="20" fill="#243448" text-anchor="middle" font-weight="600"></text><text x="195" y="94" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">参考视频 bin t − 1</text><rect x="70" y="121" width="46" height="46" rx="5" fill="#cfdae5"/><rect x="132" y="121" width="46" height="46" rx="5" fill="#81baa7"/><rect x="194" y="121" width="46" height="46" rx="5" fill="#b6cddd"/><rect x="256" y="121" width="46" height="46" rx="5" fill="#cfdae5"/><rect x="415" y="61" width="320" height="150" rx="9" fill="#f7f9fc" stroke="#c8d2dd"/><text x="575.0" y="143.0" font-size="20" fill="#243448" text-anchor="middle" font-weight="600"></text><text x="575" y="94" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">参考视频 bin t</text><rect x="450" y="121" width="46" height="46" rx="5" fill="#cfdae5"/><rect x="512" y="121" width="46" height="46" rx="5" fill="#81baa7"/><rect x="574" y="121" width="46" height="46" rx="5" fill="#b6cddd"/><rect x="636" y="121" width="46" height="46" rx="5" fill="#cfdae5"/><rect x="795" y="61" width="320" height="150" rx="9" fill="#f7f9fc" stroke="#c8d2dd"/><text x="955.0" y="143.0" font-size="20" fill="#243448" text-anchor="middle" font-weight="600"></text><text x="955" y="94" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">参考视频 bin t + 1</text><rect x="830" y="121" width="46" height="46" rx="5" fill="#cfdae5"/><rect x="892" y="121" width="46" height="46" rx="5" fill="#81baa7"/><rect x="954" y="121" width="46" height="46" rx="5" fill="#b6cddd"/><rect x="1016" y="121" width="46" height="46" rx="5" fill="#cfdae5"/><path d="M187,150 L569,150" stroke="#229777" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M948,150 L569,150" stroke="#229777" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="592" y="246" font-size="21" fill="#243448" text-anchor="middle" font-weight="400">输出 query 位于 t：相邻参考 Value 向 t 移动一格</text><text x="24" y="289" font-size="19" fill="#243448" text-anchor="start" font-weight="400">固定空间位置：沿时间移动时保持 patch 索引。</text><text x="24" y="325" font-size="19" fill="#243448" text-anchor="start" font-weight="400">特征匹配位置：根据相邻帧互为最近邻的 Value 特征，选择接收 patch。</text><text x="24" y="361" font-size="19" fill="#243448" text-anchor="start" font-weight="400">匹配不可靠的位置保持原 Value；本次比较中，两种方案共用接受位置。</text></svg>