<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 748" role="img" aria-label="原始时间坐标与原点对齐的对照及MM-RoPE作用位置" style="font-family:Arial, PingFang SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="24" y="32" font-size="24" fill="#243448" text-anchor="start" font-weight="600">参考视频与生成视频的时间位置编码</text><text x="24" y="65" font-size="18" fill="#526277" text-anchor="start" font-weight="400">位置编码对照：单个参考视频；相同时间采样与空间网格</text><text x="24" y="112" font-size="22" fill="#243448" text-anchor="start" font-weight="600">原始 PackedLayout</text><text x="24" y="155" font-size="19" fill="#243448" text-anchor="start" font-weight="400">参考视频</text><text x="24" y="225" font-size="19" fill="#243448" text-anchor="start" font-weight="400">生成视频</text><rect x="220" y="126" width="280" height="52" rx="9" fill="#e4f4ee" stroke="#459c81"/><text x="360.0" y="159.0" font-size="19" fill="#243448" text-anchor="middle" font-weight="600">τ₀ … τ₃₁</text><rect x="710" y="196" width="280" height="52" rx="9" fill="#eee8fa" stroke="#a18ac4"/><text x="850.0" y="229.0" font-size="19" fill="#243448" text-anchor="middle" font-weight="600">τ₀ … τ₃₁</text><text x="220" y="199" font-size="17" fill="#243448" text-anchor="start" font-weight="400">时间坐标起点 r₀</text><text x="710" y="272" font-size="17" fill="#243448" text-anchor="start" font-weight="400">时间坐标起点 r₀ + Δ</text><path d="M220,284 H710" stroke="#9b6742" stroke-width="2"/><text x="465" y="308" font-size="18" fill="#9b6742" text-anchor="middle" font-weight="400">Δ 来自实际序列布局</text><text x="24" y="363" font-size="22" fill="#243448" text-anchor="start" font-weight="600">原点对齐</text><text x="24" y="406" font-size="19" fill="#243448" text-anchor="start" font-weight="400">参考视频</text><text x="24" y="476" font-size="19" fill="#243448" text-anchor="start" font-weight="400">生成视频</text><rect x="220" y="377" width="280" height="52" rx="9" fill="#e4f4ee" stroke="#459c81"/><text x="360.0" y="410.0" font-size="19" fill="#243448" text-anchor="middle" font-weight="600">τ₀ … τ₃₁</text><rect x="220" y="447" width="280" height="52" rx="9" fill="#eee8fa" stroke="#a18ac4"/><text x="360.0" y="480.0" font-size="19" fill="#243448" text-anchor="middle" font-weight="600">τ₀ … τ₃₁</text><path d="M220,369 V510" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5"/><text x="534" y="408" font-size="21" fill="#243448" text-anchor="start" font-weight="600">生成视频／音频：t′ = t − Δ</text><text x="534" y="445" font-size="18" fill="#243448" text-anchor="start" font-weight="400">同一物理时刻的参考与输出具有相同时间坐标。</text><text x="534" y="477" font-size="18" fill="#243448" text-anchor="start" font-weight="400">帧顺序、采样时刻、空间坐标保持。</text><text x="24" y="552" font-size="21" fill="#243448" text-anchor="start" font-weight="600">作用位置</text><rect x="24" y="575" width="265" height="66" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="156.5" y="603" font-size="19" fill="#243448" text-anchor="middle" font-weight="600">时间坐标 t′</text><text x="156.5" y="628" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">PackedLayout → 新旋转表</text><path d="M289,608 L332,608" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="332" y="575" width="265" height="66" rx="9" fill="#e4f4ee" stroke="#459c81"/><text x="464.5" y="603" font-size="19" fill="#243448" text-anchor="middle" font-weight="600">MM-RoPE(Q, K)</text><text x="464.5" y="628" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">每个 DiT Block</text><path d="M597,608 L640,608" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="640" y="575" width="265" height="66" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="772.5" y="603" font-size="19" fill="#243448" text-anchor="middle" font-weight="600">Attention → 输出 O</text><text x="772.5" y="628" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">沿用原始注意力计算</text><text x="24" y="687" font-size="18" fill="#243448" text-anchor="start" font-weight="400">这一变更影响输出 tokens 与其他模态的相对位置关系；使用完整成片检验编辑和时序。</text><text x="24" y="721" font-size="17" fill="#526277" text-anchor="start" font-weight="400">横向位置为示意。R122 实际 Δ = 178.333333 个位置坐标单位；Δ 的单位不同于动作延迟帧数。</text></svg>