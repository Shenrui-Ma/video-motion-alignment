<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 425" role="img" aria-label="自动观察和决策实际流程及当前验证状态" style="font-family:Arial, PingFang SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="24" y="30" font-size="23" fill="#243448" text-anchor="start" font-weight="600">自动原型：每一步观察预测成片，再决定本步是否引导</text><rect x="24" y="64" width="214" height="80" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="131.0" y="92" font-size="19" fill="#243448" text-anchor="middle" font-weight="600">当前 noisy latent</text><text x="131.0" y="117" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">k = 0 … 19</text><rect x="258" y="64" width="214" height="80" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="365.0" y="92" font-size="19" fill="#243448" text-anchor="middle" font-weight="600">普通 H3 预测</text><text x="365.0" y="117" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">预测 clean latent → 解码</text><rect x="492" y="64" width="214" height="80" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="599.0" y="92" font-size="19" fill="#243448" text-anchor="middle" font-weight="600">测量可见动作</text><text x="599.0" y="117" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">参考 / 生成：关节方向</text><rect x="726" y="64" width="214" height="80" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="833.0" y="92" font-size="19" fill="#243448" text-anchor="middle" font-weight="600">扫描时间窗口</text><text x="833.0" y="117" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">16 / 32 帧 · stride 4</text><path d="M238,105 L258,105" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M472,105 L492,105" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M706,105 L726,105" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M940,105 L1085,105" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M1085,105 L1085,218" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="788" y="218" width="354" height="87" rx="9" fill="#e4f4ee" stroke="#459c81"/><text x="965.0" y="246" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">判断偏移证据是否持续</text><text x="965.0" y="271" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">误差相对下降 &gt; 50%，连续两步</text><path d="M788,261 L740,261" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="448" y="218" width="292" height="87" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="594.0" y="246" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">通过 → 重新做 guided 预测</text><text x="594.0" y="271" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">从本步同一 noisy latent 开始</text><path d="M448,261 L402,261" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="24" y="218" width="378" height="87" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="213.0" y="246" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">使用选定预测更新一次 latent</text><text x="213.0" y="271" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">未通过 / UNKNOWN → 使用普通预测</text><path d="M94,218 L94,173 L100,144" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/><text x="24" y="354" font-size="20" fill="#243448" text-anchor="start" font-weight="400">停止：下一步重新判断，条件不再满足就停止该步引导；后续再次满足可重新开启。</text><text x="24" y="391" font-size="18" fill="#985b23" text-anchor="start" font-weight="400">验证状态：早期两条已实际启停；后续五条未触发。可见手臂测量版本待 GPU 验证。</text></svg>