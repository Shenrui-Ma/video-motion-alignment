<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 508" role="img" aria-label="Attention读出替换及参考总权重保持示意" style="font-family:Arial, PingFang SC, Microsoft YaHei, sans-serif"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="24" y="29" font-size="23" fill="#243448" text-anchor="start" font-weight="600">同一个输出 query，重新分配参考视频的 Attention 时间权重</text><rect x="24" y="60" width="254" height="74" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="151.0" y="88" font-size="19" fill="#243448" text-anchor="middle" font-weight="600">输出 query：时间 bin τ</text><text x="151.0" y="113" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">联合多模态 self-attention</text><path d="M278,97 L327,97" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="327" y="60" width="245" height="74" rx="9" fill="#fff4e6" stroke="#d9ab68"/><text x="449.5" y="88" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">加权 Value z</text><text x="449.5" y="113" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">参考视频所有时间的 K / V</text><rect x="327" y="157" width="245" height="74" rx="9" fill="#e4f4ee" stroke="#459c81"/><text x="449.5" y="185" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">加权 Value zτ</text><text x="449.5" y="210" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">仅时间 bin τ 的参考 K / V</text><path d="M300,97 L300,194 L327,194" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><path d="M572,97 L630,145" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/><path d="M572,194 L630,169" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="630" y="112" width="230" height="92" rx="9" fill="#e4f4ee" stroke="#459c81"/><text x="745.0" y="140" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">计算替换量</text><text x="745.0" y="165" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">α × m × (zτ − z)</text><path d="M860,158 L908,158" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)"/><rect x="908" y="112" width="244" height="92" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="1030.0" y="140" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">加入原输出 O</text><text x="1030.0" y="165" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">得到 O′，再做输出投影</text><text x="24" y="286" font-size="20" fill="#243448" text-anchor="start" font-weight="600">参考权重总和 m 保持；参考时间概率分布改变</text><text x="24" y="341" font-size="20" fill="#243448" text-anchor="start" font-weight="400">普通编辑</text><rect x="156" y="314" width="240" height="43" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="276.0" y="342.5" font-size="17" fill="#243448" text-anchor="middle" font-weight="600">其他 tokens：加权项保留</text><rect x="424" y="314" width="124" height="43" fill="#b8cde0" rx="5"/><text x="486" y="341" font-size="17" fill="#243448" text-anchor="middle" font-weight="400">参考 t1</text><rect x="556" y="314" width="124" height="43" fill="#7299c4" rx="5"/><text x="618" y="341" font-size="17" fill="#243448" text-anchor="middle" font-weight="400">参考 t2</text><rect x="688" y="314" width="124" height="43" fill="#91b5d4" rx="5"/><text x="750" y="341" font-size="17" fill="#243448" text-anchor="middle" font-weight="400">参考 t3 = τ</text><rect x="820" y="314" width="124" height="43" fill="#5d83b0" rx="5"/><text x="882" y="341" font-size="17" fill="#243448" text-anchor="middle" font-weight="400">参考 t4</text><rect x="952" y="314" width="124" height="43" fill="#afc5dd" rx="5"/><text x="1014" y="341" font-size="17" fill="#243448" text-anchor="middle" font-weight="400">参考 t5</text><text x="24" y="417" font-size="20" fill="#243448" text-anchor="start" font-weight="400">时序引导</text><rect x="156" y="390" width="240" height="43" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="276.0" y="418.5" font-size="17" fill="#243448" text-anchor="middle" font-weight="600">其他 tokens：加权项保留</text><rect x="424" y="390" width="124" height="43" fill="#e7edf2" rx="5"/><text x="486" y="417" font-size="17" fill="#243448" text-anchor="middle" font-weight="400">参考 t1</text><rect x="556" y="390" width="124" height="43" fill="#e7edf2" rx="5"/><text x="618" y="417" font-size="17" fill="#243448" text-anchor="middle" font-weight="400">参考 t2</text><rect x="688" y="390" width="124" height="43" fill="#269777" rx="5"/><text x="750" y="417" font-size="17" fill="#243448" text-anchor="middle" font-weight="400">参考 t3 = τ</text><rect x="820" y="390" width="124" height="43" fill="#e7edf2" rx="5"/><text x="882" y="417" font-size="17" fill="#243448" text-anchor="middle" font-weight="400">参考 t4</text><rect x="952" y="390" width="124" height="43" fill="#e7edf2" rx="5"/><text x="1014" y="417" font-size="17" fill="#243448" text-anchor="middle" font-weight="400">参考 t5</text><text x="24" y="474" font-size="18" fill="#526277" text-anchor="start" font-weight="400">图示 α = 1；同一时间 bin 内的空间对应由 QK 相似度分配。</text></svg>