<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" viewBox="0 0 1180 740" role="img" aria-labelledby="fig-title fig-desc">
<title id="reportfig5-fig-title">H3 单流 DiT：双向时序 Attention 修正</title>
<desc id="reportfig5-fig-desc">一个 H3 DiT block 内，生成 T 和参考 R 各含三个时间 bin，每个 bin 含多个空间 token。两条分支基于同一组原 Q、K、V 并行计算。正向生成 query 读取同时间 bin 的参考 key 与 value，O_T prime 等于 O_T 加 alpha m_R 乘以 mu_R same 减 mu_R all。反向参考 query 读取同时间 bin 的生成 key 与 value，O_R prime 等于 O_R 加 beta m_T 乘以 mu_T same 减 mu_T all。修正加在各 head 原 Joint Attention 输出 O 上，再经 out_proj W_O、残差与 FFN 进入下个 block。更新的参考 hidden states 继续影响后续层生成。参考初始 latent 每个采样步重新提供，不回写参考文件。</desc>
