<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 78 1190 646" role="img" aria-label="只在辅助视频参考Attention分支旋转query时间相位的计算路径" style="font-family:Arial, PingFang SC, Microsoft YaHei, sans-serif"><defs><marker id="reportfig8-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="24" y="106" width="265" height="76" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="156.5" y="134" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">原始 Q、K、V</text><text x="156.5" y="159" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">Q / K 已施加原始 MM-RoPE</text><path d="M289,144 L338,144" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#reportfig8-arr)"/><rect x="338" y="106" width="370" height="76" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="523.0" y="134" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">完整多模态 Self-attention</text><text x="523.0" y="159" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">text · refs · audio · video</text><path d="M708,144 L758,144" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#reportfig8-arr)"/><rect x="758" y="106" width="390" height="76" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="953.0" y="134" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">原始 Attention 输出 O</text><text x="953.0" y="159" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">同时保存 softmax 的 logsumexp</text><text x="24" y="232" font-size="20" fill="#243448" text-anchor="start" font-weight="600">只取输出视频 query 和参考视频 K / V</text><rect x="24" y="264" width="265" height="76" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="156.5" y="292" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">原始视频 query q</text><text x="156.5" y="317" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">取自上方 Q 的视频部分</text><path d="M289,302 L338,302" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#reportfig8-arr)"/><rect x="338" y="264" width="370" height="76" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="523.0" y="292" font-size="21" fill="#243448" text-anchor="middle" font-weight="600">softmax(q Kᵀᵣ / √d) Vᵣ</text><text x="523.0" y="317" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">参考视频所有时间位置</text><path d="M708,302 L758,302" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#reportfig8-arr)"/><rect x="758" y="264" width="390" height="76" rx="9" fill="#edf2f7" stroke="#c8d2dd"/><text x="953.0" y="292" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">原参考加权 Value：z</text><text x="953.0" y="317" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">及参考概率总和 m</text><rect x="24" y="386" width="265" height="76" rx="9" fill="#e4f4ee" stroke="#459c81"/><text x="156.5" y="414" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">q′ = Rtime(−Δ) q</text><text x="156.5" y="439" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">只在此分支旋转时间相位</text><path d="M156,340 L156,386" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#reportfig8-arr)"/><path d="M289,424 L338,424" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#reportfig8-arr)"/><rect x="338" y="386" width="370" height="76" rx="9" fill="#e4f4ee" stroke="#459c81"/><text x="523.0" y="414" font-size="21" fill="#243448" text-anchor="middle" font-weight="600">softmax(q′ Kᵀᵣ / √d) Vᵣ</text><text x="523.0" y="439" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">同一组参考 K / V；所有时间参与</text><path d="M708,424 L758,424" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#reportfig8-arr)"/><rect x="758" y="386" width="390" height="76" rx="9" fill="#e4f4ee" stroke="#459c81"/><text x="953.0" y="414" font-size="20" fill="#243448" text-anchor="middle" font-weight="600">对齐分支的加权 Value：zΔ</text><text x="953.0" y="439" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">对应参考与输出的时间原点</text><text x="24" y="530" font-size="21" fill="#243448" text-anchor="start" font-weight="600">m = exp(LSEᵣ − LSEall)</text><text x="24" y="562" font-size="18" fill="#243448" text-anchor="start" font-weight="400">原 softmax 中参考视频</text><text x="24" y="589" font-size="18" fill="#243448" text-anchor="start" font-weight="400">所有 key 的概率总和</text><rect x="338" y="516" width="810" height="90" rx="9" fill="#e4f4ee" stroke="#459c81"/><text x="743.0" y="544" font-size="25" fill="#243448" text-anchor="middle" font-weight="600">O′ = O + αm (zΔ − z)</text><text x="743.0" y="569" font-size="16" fill="#526277" text-anchor="middle" font-weight="400">替换参考部分的条件概率分布，再进行输出投影 Wₒ</text><path d="M953,462 L953,516" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#reportfig8-arr)"/><path d="M1158,144 H1170 V502 H1110 V516" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#reportfig8-arr)"/><path d="M1148,302 H1158 V488 H790 V516" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#reportfig8-arr)"/><path d="M290,561 L338,561" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#reportfig8-arr)"/><text x="24" y="659" font-size="20" fill="#243448" text-anchor="start" font-weight="600">本次配置：第 7–15 个去噪步，全部 50 个 DiT Block，α = 1。</text><text x="24" y="695" font-size="18" fill="#526277" text-anchor="start" font-weight="400">Δ 由 PackedLayout 的时间原点差计算；图中展示计算路径，成片结果在实验部分报告。</text></svg>