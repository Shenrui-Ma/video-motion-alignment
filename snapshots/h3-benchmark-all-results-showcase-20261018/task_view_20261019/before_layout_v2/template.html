<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>H3 视频实验 · 按任务查看</title>
<style>
:root{color-scheme:dark;--bg:#111315;--panel:#1a1d20;--line:#31363b;--muted:#a7afb6;--ink:#f2f3f4;--accent:#b9d7ed;--warm:#e9bc88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button,input,select{color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 11px}button:hover{border-color:#8cabbc}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{padding:20px 30px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}header h1{font-size:21px;margin:0;font-weight:650}header p{margin:3px 0 0;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:275px minmax(0,1fr);min-height:calc(100vh - 90px)}aside{border-right:1px solid var(--line);padding:19px 14px;height:calc(100vh - 90px);position:sticky;top:0;overflow-y:auto}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 3px 16px}.filters input{grid-column:1/-1;width:100%;font-size:13px}.filters select{width:100%;font-size:12px;padding:6px}.section-label{font-size:11px;letter-spacing:.08em;color:var(--muted);margin:20px 10px 8px}.task-button{width:100%;text-align:left;border:1px solid transparent;background:none;margin:2px 0;padding:10px 12px;border-radius:7px;font-size:13px;line-height:1.5}.task-button[aria-current=true]{background:#253139;border-color:#4a6578}.task-button span{display:block}.task-button small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.empty-list{color:var(--muted);padding:16px;font-size:13px}main{min-width:0;padding:27px 32px 60px;max-width:1900px;width:100%;margin:auto}.kicker{font-size:12px;color:var(--accent);letter-spacing:.04em;margin:0 0 6px}h2{font-size:clamp(22px,2.2vw,33px);line-height:1.35;margin:0 0 10px;font-weight:620;letter-spacing:-.03em}.task-text{font-size:15px;color:#cbd0d4;max-width:1100px;margin:0 0 18px}.version-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.version-row label{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:10px}.version-row select{max-width:510px;font-size:13px}.state{font-size:12px;color:var(--warm);white-space:nowrap}.state.pass{color:#accaba}.player-shell{background:#000;border:1px solid #292d31;border-radius:7px;overflow:hidden}.video-grid{display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));gap:2px;align-items:center;background:#000;min-height:220px}figure{margin:0;min-width:0}video{display:block;width:100%;max-height:66vh;object-fit:contain;background:#000}figcaption{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:8px;padding:10px 8px;background:#000;color:#e1e4e6;font-size:12px;text-align:center}.video-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-top:1px solid #292d31;flex-wrap:wrap;background:#171a1d}.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.tools button,.tools select{font-size:12px;padding:5px 9px}.time{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.loading{padding:80px 12px;text-align:center;color:var(--muted)}.findings{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:19px}.finding{padding:15px 17px;border:1px solid var(--line);border-radius:7px}.finding h3{font-size:12px;color:var(--muted);font-weight:500;margin:0 0 6px}.finding p{font-size:14px;margin:0}.next{font-size:13px;color:var(--warm);margin:12px 0}.under{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:20px}h3{font-size:14px;margin:0 0 9px;font-weight:600}table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}th,td{text-align:left;border-bottom:1px solid var(--line);padding:8px 10px 8px 0}th{font-weight:400;color:var(--muted);font-size:12px}td{color:#e1e5e8}.metric-note{font-size:12px;color:var(--muted);margin:8px 0}.ref-line{display:flex;align-items:flex-start;gap:15px}.ref-line img{max-width:100px;max-height:130px;object-fit:contain;background:#000;border-radius:4px}.ref-line button{padding:0;background:none;border:0}.ref-line p{font-size:13px;margin:0 0 5px;color:var(--muted)}details{border-top:1px solid var(--line);margin-top:20px;padding-top:12px}summary{cursor:pointer;font-size:12px;color:var(--muted)}details p,details pre{font-size:12px;color:#bcc4ca;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}dialog{background:var(--bg);color:var(--ink);border:1px solid var(--line);max-width:90vw;max-height:90vh;border-radius:8px}dialog::backdrop{background:#000b}dialog img{display:block;max-width:80vw;max-height:75vh;margin:15px auto}dialog button{float:right}footer{font-size:11px;color:var(--muted);margin-top:28px}.mobile-nav{display:none}.event-row td{cursor:pointer}.event-row:hover td{background:#232a30}[hidden]{display:none!important}@media(min-width:1900px){video{max-height:70vh}}@media(max-width:1000px){.layout{grid-template-columns:225px minmax(0,1fr)}main{padding:22px 20px}.under{grid-template-columns:1fr}.version-row{align-items:flex-start;flex-direction:column}.version-row select{max-width:65vw}}@media(max-width:720px){header{padding:14px 16px}header .meta{display:none}.layout{display:block}aside{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line);max-height:290px;padding:12px}.filters{margin-bottom:8px}.section-label{margin-top:10px}.task-button{padding:6px 9px}.task-button small{display:none}main{padding:20px 12px}.findings{grid-template-columns:1fr;gap:10px}.video-grid{min-height:100px}figcaption{font-size:10px}.under{gap:12px}h2{font-size:23px}.version-row select{max-width:74vw}}
</style></head>
<body>
<header><div><h1>H3 视频编辑实验</h1><p>按任务查看参考素材、普通编辑与时序引导</p></div><div class="meta"><p id="counts"></p><p id="updated"></p></div></header>
<div class="layout"><aside aria-label="实验任务导航"><div class="filters"><input id="search" type="search" aria-label="搜索任务" placeholder="搜索任务、人物或素材编号"><select id="bench" aria-label="数据集"><option value="">全部数据集</option><option>FlexiAct</option><option>IVEBench</option></select><select id="status" aria-label="编辑完成情况"><option value="">全部状态</option><option value="done">编辑已完成</option><option value="repair">编辑待修复</option><option value="review">待复核</option></select></div><nav id="task-list"></nav></aside>
<main id="content"><p class="loading">正在加载内嵌实验素材…</p></main></div>
<dialog id="image-dialog"><button id="close-image">关闭</button><img id="large-image" alt="实际使用的角色参考图"></dialog>
<script id="metadata" type="application/json">__DATA__</script>
<!-- MEDIA -->
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('metadata').textContent),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let currentTask=null,currentVersion=null,players=[],generation=0,urls=[];
function assetURL(id){return 'data:'+DATA.asset_types[id]+';base64,'+$('asset_'+id).textContent;}
function groupState(t){return t.state==='编辑已完成'?'done':t.state==='待复核'?'review':'repair';}
function filteredTasks(){const q=$('search').value.trim().toLowerCase();return DATA.tasks.filter(t=>(!$('bench').value||t.bench===$('bench').value)&&(!$('status').value||groupState(t)===$('status').value)&&(!q||[t.title,t.source,t.target,t.bench].join(' ').toLowerCase().includes(q)));}
function renderNav(){const tasks=filteredTasks();let html='';for(const [label,rows] of [['优先处理的六项',tasks.filter(t=>t.priority)],['IVEBench',tasks.filter(t=>!t.priority&&t.bench==='IVEBench')],['FlexiAct',tasks.filter(t=>!t.priority&&t.bench==='FlexiAct')]]){if(!rows.length)continue;html+='<div class="section-label">'+label+' · '+rows.length+'</div>';for(const t of rows)html+='<button class="task-button" data-key="'+esc(t.key)+'" aria-current="'+(currentTask?.key===t.key)+'"><span>'+esc(t.title)+'</span><small>'+esc(t.bench+' · '+t.state)+'</small></button>';} $('task-list').innerHTML=html||'<p class="empty-list">没有匹配的任务</p>';for(const b of $('task-list').querySelectorAll('button'))b.onclick=()=>selectTask(b.dataset.key);}
function numeric(n){return typeof n==='number'&&Number.isFinite(n)?n.toFixed(4):'待评测';}
function metricColumns(v){
 const m=v.mf||{};
 if(v.mode==='prompt_control')return {labels:['旧提示词','新版提示词'],values:v.repair_mf?[v.repair_mf.old_native,v.repair_mf.new_native]:[m.native,m.alternative_native]};
 if(v.mode==='sampler_control')return {labels:['Euler','res_multistep'],values:[m.euler,m.res_multistep]};
 if(typeof m.fixed_control==='number')return {labels:['普通编辑','固定时序引导','空间分布引导'],values:[m.native,m.fixed_control,m.guided]};
 if(typeof m.original_fixed==='number')return {labels:['普通编辑','固定6–14步','延长6–19步'],values:[m.native,m.original_fixed,m.guided]};
 if(v.mode==='native_only')return {labels:['普通编辑'],values:[m.native]};
 return {labels:['普通编辑',v.method],values:[m.native,m.guided]};
}
function metricHTML(v,t){const c=metricColumns(v),vals=c.values,delta=vals.length===2&&vals.every(x=>typeof x==='number')?vals[1]-vals[0]:null;
 let s='<section><h3>'+esc(t.bench+' Motion Fidelity')+'</h3><table><thead><tr>'+c.labels.map(x=>'<th>'+esc(x)+'</th>').join('')+(delta!==null?'<th>变化</th>':'')+'</tr></thead><tbody><tr>'+vals.map(x=>'<td>'+numeric(x)+'</td>').join('')+(delta!==null?'<td>'+(delta>=0?'+':'')+delta.toFixed(4)+'</td>':'')+'</tr></tbody></table><p class="metric-note">官方整体运动保持评分，越高越好。'+(t.bench==='FlexiAct'?'FlexiAct 比较轨迹运动方向。':'IVEBench 比较轨迹位置与位移。')+'</p>';
 if(v.events?.events){let rows='';const sampler=v.mode==='sampler_control',names=sampler?['Euler','res_multistep']:['普通编辑',v.method],fields=sampler?['euler_frames','res_multistep_frames']:['native_frames','guided_frames'];
 for(const e of v.events.events){if(!e.source_frames||!e[fields[0]]||!e[fields[1]])continue;const format=(a)=>{const lo=(a[0]-e.source_frames[1])/v.events.fps,hi=(a[1]-e.source_frames[0])/v.events.fps;return lo.toFixed(2)+' ～ '+hi.toFixed(2)};rows+='<tr class="event-row" data-time="'+e.source_frames[0]/v.events.fps+'"><td>'+esc(e.name)+'</td><td>'+format(e[fields[0]])+'</td><td>'+format(e[fields[1]])+'</td></tr>';}
 if(rows)s+='<h3 style="margin-top:19px">动作时间差 · 秒</h3><table><tr><th>动作</th><th>'+esc(names[0])+'</th><th>'+esc(names[1])+'</th></tr>'+rows+'</table><p class="metric-note">正值为延后，负值为提前。区间来自逐帧事件标注。点击动作可跳到参考发生时刻。</p>';}
 return s+'</section>';}
function stopPlayers(){for(const v of players){v.pause();v.removeAttribute('src');v.load();}players=[];for(const url of urls)URL.revokeObjectURL(url);urls=[];}
function selectTask(key,version){const t=DATA.tasks.find(x=>x.key===key);if(!t)return;currentTask=t;currentVersion=version&&t.versions.includes(version)?version:t.current;renderNav();renderTask();history.replaceState(null,'','#'+encodeURIComponent(t.key));}
function renderTask(){stopPlayers();const token=++generation,t=currentTask,v=DATA.versions[currentVersion];let html='<p class="kicker">'+esc(t.bench+' / '+t.source)+(t.target?' / '+esc(t.target):'')+'</p><h2>'+esc(t.title)+'</h2><p class="task-text">'+esc(v.task)+'</p><div class="version-row"><label>查看版本<select id="version">';for(const id of t.versions){const p=DATA.versions[id];html+='<option value="'+esc(id)+'"'+(id===v.id?' selected':'')+'>'+esc(p.run+' · '+p.method+(id===t.current?' · 当前结果':''))+'</option>';}html+='</select></label><span class="state '+(v.task_state==='编辑已完成'?'pass':'')+'">'+esc(v.task_state)+'</span></div>';
html+='<div class="player-shell" id="player-shell"><div class="video-grid" style="--n:'+v.players.length+'">';v.players.forEach((p,i)=>{html+='<figure><video id="player'+i+'" controls playsinline preload="none" aria-label="'+esc(p.labels.join('、'))+'"></video><figcaption style="--cols:'+p.labels.length+'">'+p.labels.map(x=>'<span>'+esc(x)+'</span>').join('')+'</figcaption></figure>';});html+='</div><div class="video-tools"><div class="tools"><button id="play">播放 / 暂停</button><button id="restart">从头播放</button><select id="speed" aria-label="播放速度"><option value="1">1× 原速</option><option value="0.5">0.5× 慢放</option><option value="0.25">0.25× 慢放</option></select><button id="full">全屏</button><button id="download">下载对比视频</button></div><span class="time" id="clock">'+(v.frames/v.fps).toFixed(2)+' 秒 · '+v.fps+' fps</span></div></div>';
html+='<div class="findings"><section class="finding"><h3>编辑完成情况</h3><p>'+esc(v.edit)+'</p></section><section class="finding"><h3>动作与时序</h3><p>'+esc(v.timing)+'</p></section></div>'+(v.next?'<p class="next">下一步：'+esc(v.next)+'</p>':'');
html+='<div class="under">'+metricHTML(v,t)+'<section><h3>输入与方法</h3><div class="ref-line">';if(v.reference_image)html+='<button id="open-image" aria-label="放大实际参考图"><img id="ref-image" alt="实际角色参考图"></button>';html+='<div><p>'+esc(v.reference_image?'输入：参考视频 + 角色参考图':'输入：参考视频 + 编辑提示词')+'</p><p>'+esc('方法：'+v.method)+'</p>'+(v.pair_group?'<p>'+esc(v.pair_group)+'</p>':'')+'<p>'+esc(v.source_time)+'</p></div></div></section></div>';
html+='<details><summary>实验记录与完整审阅</summary><p>'+esc(v.id+' · '+v.method_detail)+'</p><p>'+esc(v.review_full)+'</p>'+(v.prompt?'<details><summary>实际提示词</summary><pre>'+esc(v.prompt)+'</pre></details>':'')+'</details><footer>素材已内嵌，可分享此 HTML 离线查看。更新于 '+esc(DATA.updated)+'。历史版本通过上方菜单查看。</footer>';
$('content').innerHTML=html;$('version').onchange=e=>{currentVersion=e.target.value;renderTask()};
v.players.forEach((p,i)=>{const el=$('player'+i);el.poster=assetURL(p.poster);players.push(el)});
// Attach only this task's media. Switching tasks releases the old decoders.
requestAnimationFrame(()=>{if(token!==generation)return;v.players.forEach((p,i)=>{$('player'+i).src=assetURL(p.asset)});});
if(v.reference_image){$('ref-image').src=assetURL(v.reference_image);$('open-image').onclick=()=>{$('large-image').src=assetURL(v.reference_image);$('image-dialog').showModal()};}
$('play').onclick=()=>{if(players[0].paused){const time=players[0].currentTime;for(const p of players){p.currentTime=time;p.play().catch(()=>{})}}else players.forEach(p=>p.pause())};$('restart').onclick=()=>{for(const p of players){p.currentTime=0;p.play().catch(()=>{})}};$('speed').onchange=e=>players.forEach(p=>p.playbackRate=Number(e.target.value));$('full').onclick=()=>{$('player-shell').requestFullscreen?.()};$('download').onclick=()=>{for(let i=0;i<v.players.length;i++){const a=document.createElement('a');a.href=assetURL(v.players[i].asset);a.download=v.id+(v.players.length>1?'_'+i:'')+'.mp4';a.click()}};
players[0].ontimeupdate=()=>{const p=players[0];$('clock').textContent=p.currentTime.toFixed(2)+' / '+(v.frames/v.fps).toFixed(2)+' 秒 · '+v.fps+' fps';if(players.length>1)for(const q of players.slice(1))if(Math.abs(q.currentTime-p.currentTime)>0.1)q.currentTime=p.currentTime;};
players[0].onplay=()=>{for(const p of players.slice(1)){p.currentTime=players[0].currentTime;p.play().catch(()=>{})}};players[0].onpause=()=>players.slice(1).forEach(p=>p.pause());players[0].onseeked=()=>players.slice(1).forEach(p=>p.currentTime=players[0].currentTime);
for(const row of document.querySelectorAll('[data-time]'))row.onclick=()=>{for(const p of players)p.currentTime=Number(row.dataset.time)};
}
for(const id of ['bench','status','search'])$(id).addEventListener(id==='search'?'input':'change',renderNav);
$('close-image').onclick=()=>$('image-dialog').close();$('counts').textContent=DATA.tasks.length+' 项编辑任务 · '+DATA.unique_sources+' 段参考视频 · '+Object.keys(DATA.versions).length+' 条实验记录';$('updated').textContent='更新 '+DATA.updated;
let initial;try{initial=decodeURIComponent(location.hash.slice(1))}catch{}selectTask(DATA.tasks.find(t=>t.key===initial)?.key||DATA.tasks[0].key);
</script></body></html>
