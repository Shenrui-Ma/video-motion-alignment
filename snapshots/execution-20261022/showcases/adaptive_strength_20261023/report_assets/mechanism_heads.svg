<svg class="mechanism" viewBox="0 0 1120 330" role="img" aria-label="heads" xmlns="http://www.w3.org/2000/svg"><title>heads</title><defs><marker id="arrow-heads" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#567389"/></marker></defs><text x="24" y="31" font-size="22" fill="#22313d" >02  Head 分配：总修正能量不变，重新分配系数</text><text x="24" y="58" font-size="15" fill="#627382" >Cₕ = Σ‖Dₕ‖² 使用完整分辨率；fₕ 用 probe 中时间切向能量占比估计。</text><text x="24" y="99" font-size="18" fill="#22313d" >固定 .25</text><text x="24" y="125" font-size="14" fill="#627382" >每个 head 的 α 相同</text><rect x="170" y="224.2" width="39" height="28.799999999999997" fill="#90b9ce"/><text x="189" y="276" font-size="13" fill="#22313d" text-anchor="middle">h1</text><rect x="559" y="190.6" width="39" height="62.400000000000006" fill="#258d7d"/><text x="578" y="276" font-size="13" fill="#22313d" text-anchor="middle">h1</text><rect x="234" y="185.8" width="39" height="67.2" fill="#90b9ce"/><text x="253" y="276" font-size="13" fill="#22313d" text-anchor="middle">h2</text><rect x="623" y="233.8" width="39" height="19.2" fill="#258d7d"/><text x="642" y="276" font-size="13" fill="#22313d" text-anchor="middle">h2</text><rect x="298" y="207.4" width="39" height="45.6" fill="#90b9ce"/><text x="317" y="276" font-size="13" fill="#22313d" text-anchor="middle">h3</text><rect x="687" y="130.6" width="39" height="122.4" fill="#258d7d"/><text x="706" y="276" font-size="13" fill="#22313d" text-anchor="middle">h3</text><rect x="362" y="154.60000000000002" width="39" height="98.39999999999999" fill="#90b9ce"/><text x="381" y="276" font-size="13" fill="#22313d" text-anchor="middle">h4</text><rect x="751" y="217.0" width="39" height="36.0" fill="#258d7d"/><text x="770" y="276" font-size="13" fill="#22313d" text-anchor="middle">h4</text><text x="499" y="99" font-size="18" fill="#22313d" >重新分配</text><text x="499" y="125" font-size="14" fill="#627382" >柱高 = Cₕ αₕ²；总面积相同</text><text x="817" y="108" font-size="19" fill="#22313d" >max Σ Cₕ fₕ αₕ</text><text x="817" y="148" font-size="19" fill="#22313d" >Σ Cₕ αₕ² = .25² Σ Cₕ</text><text x="817" y="185" font-size="19" fill="#22313d" >0 ≤ αₕ ≤ .5</text><text x="817" y="224" font-size="19" fill="#146c94" >αₕ = min(τ fₕ, .5)</text><text x="817" y="253" font-size="14" fill="#627382" >τ 由能量预算求得</text><text x="24" y="312" font-size="15" fill="#627382" >能量口径：head 拼接 / Wₒ 之前。柱图仅示意；实际系数见运行日志热图。</text></svg>