<svg class="mechanism" viewBox="0 0 1120 585" role="img" aria-label="anchor" xmlns="http://www.w3.org/2000/svg"><title>anchor</title><defs><marker id="arrow-anchor" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#567389"/></marker></defs><text x="24" y="30" font-size="22" fill="#22313d" >01  首步锚归一化：在当前 Attention 特征内调节强度</text><text x="24" y="56" font-size="14" fill="#627382" >n = 去噪步；t = 视频物理时间 bin；每层各有独立首步锚。下图为机制示意。</text><text x="24" y="95" font-size="17" fill="#22313d" >相同输出 query Qₜ</text><text x="24" y="122" font-size="15" fill="#22313d" >全多模态 Attention → O</text><text x="24" y="150" font-size="15" fill="#22313d" >参考视频条件输出</text><rect x="24" y="168" width="27" height="27" fill="rgb(226,238,245)"><title>示意 [0,0]=0.060</title></rect><rect x="52" y="168" width="27" height="27" fill="rgb(218,233,241)"><title>示意 [0,1]=0.100</title></rect><rect x="80" y="168" width="27" height="27" fill="rgb(189,214,228)"><title>示意 [0,2]=0.240</title></rect><rect x="108" y="168" width="27" height="27" fill="rgb(147,187,210)"><title>示意 [0,3]=0.440</title></rect><rect x="136" y="168" width="27" height="27" fill="rgb(216,231,240)"><title>示意 [0,4]=0.110</title></rect><rect x="164" y="168" width="27" height="27" fill="rgb(228,239,245)"><title>示意 [0,5]=0.050</title></rect><rect x="24" y="196" width="27" height="27" fill="rgb(228,239,245)"><title>示意 [1,0]=0.050</title></rect><rect x="52" y="196" width="27" height="27" fill="rgb(222,235,243)"><title>示意 [1,1]=0.080</title></rect><rect x="80" y="196" width="27" height="27" fill="rgb(205,225,235)"><title>示意 [1,2]=0.160</title></rect><rect x="108" y="196" width="27" height="27" fill="rgb(155,192,214)"><title>示意 [1,3]=0.400</title></rect><rect x="136" y="196" width="27" height="27" fill="rgb(193,217,230)"><title>示意 [1,4]=0.220</title></rect><rect x="164" y="196" width="27" height="27" fill="rgb(220,234,242)"><title>示意 [1,5]=0.090</title></rect><rect x="24" y="224" width="27" height="27" fill="rgb(233,242,247)"><title>示意 [2,0]=0.030</title></rect><rect x="52" y="224" width="27" height="27" fill="rgb(231,241,246)"><title>示意 [2,1]=0.040</title></rect><rect x="80" y="224" width="27" height="27" fill="rgb(212,229,238)"><title>示意 [2,2]=0.130</title></rect><rect x="108" y="224" width="27" height="27" fill="rgb(189,214,228)"><title>示意 [2,3]=0.240</title></rect><rect x="136" y="224" width="27" height="27" fill="rgb(149,188,211)"><title>示意 [2,4]=0.430</title></rect><rect x="164" y="224" width="27" height="27" fill="rgb(212,229,238)"><title>示意 [2,5]=0.130</title></rect><text x="24" y="273" font-size="14" fill="#22313d" >全部参考 → R；同一时刻 → Sₜ</text><text x="24" y="299" font-size="16" fill="#22313d" >m = exp(LSEref − LSEfull)</text><text x="24" y="328" font-size="22" fill="#146c94" >D = m (Sₜ − R)</text><path d="M237 211L296 211" stroke="#567389" stroke-width="2" marker-end="url(#arrow-anchor)"/><text x="303" y="95" font-size="17" fill="#22313d" >Qₜ 固定，只移动参考 K/V 时间</text><rect x="305" y="118" width="58" height="64" rx="3" fill="#d5e8ed"/><text x="334" y="146" font-size="17" fill="#22313d" text-anchor="middle">t−1</text><text x="334" y="169" font-size="16" fill="#22313d" text-anchor="middle">S₋</text><rect x="384" y="118" width="58" height="64" rx="3" fill="#8dbccf"/><text x="413" y="146" font-size="17" fill="#22313d" text-anchor="middle">t</text><text x="413" y="169" font-size="16" fill="#22313d" text-anchor="middle">Sₜ</text><rect x="463" y="118" width="58" height="64" rx="3" fill="#d5e8ed"/><text x="492" y="146" font-size="17" fill="#22313d" text-anchor="middle">t+1</text><text x="492" y="169" font-size="16" fill="#22313d" text-anchor="middle">S₊</text><text x="306" y="211" font-size="20" fill="#22313d" >b = S₊ − S₋</text><line x1="317" y1="326" x2="523" y2="326" stroke="#a5bac6"/><line x1="317" y1="326" x2="502" y2="246" stroke="#146c94" stroke-width="3" marker-end="url(#arrow-anchor)"/><line x1="317" y1="326" x2="493.6" y2="249.6" stroke="#259b83" stroke-width="6"/><line x1="317" y1="326" x2="480" y2="218" stroke="#9a623d" stroke-width="3" marker-end="url(#arrow-anchor)"/><line x1="480" y1="218" x2="493.6" y2="249.6" stroke="#9a623d" stroke-dasharray="4 4"/><text x="500" y="237" font-size="17" fill="#146c94" >b</text><text x="478" y="209" font-size="17" fill="#9a623d" >D</text><text x="372" y="297" font-size="15" fill="#167661" >Dᵀ</text><text x="501" y="229" font-size="15" fill="#9a623d" >Dᴺ</text><text x="304" y="355" font-size="17" fill="#22313d" >Dᵀ = b ⟨D,b⟩ / ‖b‖²</text><text x="304" y="382" font-size="17" fill="#22313d" >Dᴺ = D − Dᵀ</text><text x="304" y="409" font-size="17" fill="#22313d" >A = Σ‖Dᵀ‖²   B = Σ‖Dᴺ‖²</text><path d="M554 211L594 211" stroke="#567389" stroke-width="2" marker-end="url(#arrow-anchor)"/><text x="611" y="95" font-size="17" fill="#22313d" >首个有效步冻结 A₀、B₀</text><text x="611" y="123" font-size="18" fill="#22313d" >vT = A/A₀；vN = B/B₀</text><text x="611" y="151" font-size="18" fill="#22313d" >v = (vT + vN)/2</text><text x="611" y="185" font-size="15" fill="#22313d" >α₀ = .25；c = (1−α₀)/α₀ = 3；μ = 1</text><path d="M616 208V276H1057" fill="none" stroke="#cad7dc"/><path d="M616 248Q700 239 748 226T878 239T1052 214" fill="none" stroke="#218a79" stroke-width="2"/><path d="M616 248Q725 255 803 246T948 255T1052 242" fill="none" stroke="#ab7653" stroke-width="2"/><circle cx="616" cy="248" r="5" fill="#22313d"/><text x="629" y="232" font-size="13" fill="#22313d" >锚 = 1</text><text x="1010" y="207" font-size="14" fill="#218a79" >vT</text><text x="1010" y="265" font-size="14" fill="#ab7653" >vN</text><text x="636" y="300" font-size="13" fill="#627382" >示意：比较相对首步的变化，非实测曲线</text><text x="611" y="342" font-size="18" fill="#22313d" >J = (1−α)²vT + 3α²vN + (α−.25)²v</text><text x="611" y="380" font-size="18" fill="#22313d" >α* = clip [ (vT + .25v)/(vT + 3vN + v), 0, .5 ]</text><text x="24" y="462" font-size="24" fill="#146c94" >合并 heads → Wₒ [ O + α* D ]</text><text x="24" y="495" font-size="16" fill="#22313d" >首个有效步与无可靠统计时使用 .25；锚在同一 layer / run 内固定。</text><text x="24" y="523" font-size="15" fill="#627382" >仅增两次小 query 邻时刻 Attention；不增加 DiT / VAE 前向。统计排除有效窗口首尾 probe。</text><text x="24" y="551" font-size="15" fill="#627382" >A / B 描述局部时间变化方向及其正交补；正交补也包含非线性运动、遮挡等变化。</text></svg>